-
  id: "1791376426962"
  alias: "Kotel V4 – bezpečný start podle politiky"
  description: "Jediný vlastník normálního zapnutí kotlového relé. Zachovává 120s anti-cycling delay a navíc vyžaduje Flow V4=NORMAL, žádný recovery/lockout/servis a neaktivní TUV hydraulickou cestu před i po delay. Oprava 2026-10-09: změny atributů demand senzoru nesmějí restartovat 120s časovač; spouštět jen skutečný přechod ON/OFF. Na přechod unknown/unavailable se rovněž okamžitě ruší čekající start, bez restartu při změně atributů. Po Flow V4 recovery se start odloží do alespoň 240 s stabilního NORMAL, aby se stihl obnovit PI feedback hlavic."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id:
        - "input_boolean.topny_system_enable"
        - "input_select.topny_rezim"
        - "binary_sensor.kotel_mode_off_block"
        - "input_select.heating_flow_state_v4"
        - "binary_sensor.boiler_ww3wayvalve"
        - "binary_sensor.boiler_wwcharging"
        - "binary_sensor.boiler_tapwateractive"
      id: "policy"
    -
      trigger: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      to: "on"
      id: "demand_on"
    -
      trigger: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      to: "off"
      id: "demand_off"
    -
      trigger: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      to: "unavailable"
      id: "demand_unavailable"
    -
      trigger: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      to: "unknown"
      id: "demand_unknown"
    -
      trigger: "state"
      entity_id: "sensor.kotel_effective_on_delay_sec"
      id: "delay_change"
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      id: "relay"
    -
      trigger: "homeassistant"
      event: "start"
      id: "start"
    -
      trigger: "event"
      event_type: "automation_reloaded"
      id: "reload"
  condition:
    []
  action:
    -
      condition: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      state: "on"
    -
      condition: "state"
      entity_id: "switch.kotel_rele_spinac"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.topny_system_enable"
      state: "on"
    -
      condition: "state"
      entity_id: "input_select.topny_rezim"
      state:
        - "Auto"
        - "Eco"
        - "Boost"
    -
      condition: "state"
      entity_id: "binary_sensor.kotel_mode_off_block"
      state: "off"
    -
      condition: "state"
      entity_id: "input_select.heating_flow_state_v4"
      state: "NORMAL"
    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_ww3wayvalve"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_wwcharging"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_tapwateractive"
      state: "off"
    -
      delay:
        seconds: "{{ [states('sensor.kotel_effective_on_delay_sec') | int(120), 120, (240 - (as_timestamp(now()) - as_timestamp(states.input_select.heating_flow_state_v4.last_changed, as_timestamp(now())))) | int(0)] | max }}"
    -
      condition: "state"
      entity_id: "binary_sensor.kotel_should_be_on"
      state: "on"
    -
      condition: "state"
      entity_id: "switch.kotel_rele_spinac"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.topny_system_enable"
      state: "on"
    -
      condition: "state"
      entity_id: "input_select.topny_rezim"
      state:
        - "Auto"
        - "Eco"
        - "Boost"
    -
      condition: "state"
      entity_id: "binary_sensor.kotel_mode_off_block"
      state: "off"
    -
      condition: "state"
      entity_id: "input_select.heating_flow_state_v4"
      state: "NORMAL"
    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_ww3wayvalve"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_wwcharging"
      state: "off"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_tapwateractive"
      state: "off"
    -
      action: "switch.turn_on"
      target:
        entity_id: "switch.kotel_rele_spinac"
  initial_state: true
-
  id: "1791542912666"
  alias: "Topení – watchdog dostupnosti a teplot kotle (živý)"
  description: "Monitoring bez zásahů do kotle. Teplotní varování 69 °C, HARD_LOCKOUT, požadavek bez topení, nízká teplota bez hořáku a porucha EMS. Persistent notifications mají stálé ID; push pouze při nových stavových triggerech. Flow V4 zůstává jediným vykonavatelem bezpečnostních zásahů. Okamžitý mobilní alarm pro události 2964–2967, i když nouzová logika krátce poté vypne master a zanikne poptávka. Upozornění zůstává uloženo jako záznam incidentu."
  mode: "restart"
  trigger:
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      above: 69
      for:
        seconds: 20
      id: "hot"
    -
      trigger: "state"
      entity_id: "input_select.heating_flow_state_v4"
      to: "HARD_LOCKOUT"
      id: "lockout"
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      to: "off"
      for:
        minutes: 10
      id: "relay_stopped"
    -
      trigger: "state"
      entity_id: "binary_sensor.boiler_burngas"
      to: "off"
      for:
        minutes: 15
      id: "burn_stopped"
    -
      trigger: "state"
      entity_id: "sensor.system_bus_status"
      from: "connected"
      for:
        minutes: 2
      id: "bus_disconnect"
    -
      trigger: "time_pattern"
      minutes: "/5"
      id: "periodic"
    -
      trigger: "homeassistant"
      event: "start"
      id: "start"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "fault_2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "fault_2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "fault_2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "fault_2967"
  condition:
    []
  action:
    -
      if:
        -
          condition: "numeric_state"
          entity_id: "sensor.boiler_heatblock"
          above: 69
        -
          condition: "state"
          entity_id: "binary_sensor.boiler_burngas"
          state: "on"
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_high_temp"
            title: "Topení – zvýšená teplota kotle"
            message: "Teplota kotlového bloku je {{ states('sensor.boiler_heatblock') }} °C, výstup {{ states('sensor.boiler_curflowtemp') }} °C a hořák {{ states('binary_sensor.boiler_burngas') }}. Ochrana Flow V4 při překročení 72 °C přebírá řízení."
        -
          if:
            -
              condition: "trigger"
              id:
                - "hot"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – provozní alarm"
                message: "Teplota kotlového bloku je {{ states('sensor.boiler_heatblock') }} °C, výstup {{ states('sensor.boiler_curflowtemp') }} °C a hořák {{ states('binary_sensor.boiler_burngas') }}. Ochrana Flow V4 při překročení 72 °C přebírá řízení."
      else:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_watchdog_high_temp"
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "HARD_LOCKOUT"
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_lockout"
            title: "Topení – blokace HARD_LOCKOUT"
            message: "Kotel je v HARD_LOCKOUT. Akt. zóny: {{ states('sensor.kotel_aktivni_zony_pocet') }}, výstup: {{ states('sensor.boiler_curflowtemp') }} °C, poslední kód: {{ states('sensor.boiler_servicecodenumber') }}. Ověřte důvod zámku a průtok, neobcházejte ochranu."
        -
          if:
            -
              condition: "trigger"
              id:
                - "lockout"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – provozní alarm"
                message: "Kotel je v HARD_LOCKOUT. Akt. zóny: {{ states('sensor.kotel_aktivni_zony_pocet') }}, výstup: {{ states('sensor.boiler_curflowtemp') }} °C, poslední kód: {{ states('sensor.boiler_servicecodenumber') }}. Ověřte důvod zámku a průtok, neobcházejte ochranu."
      else:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_watchdog_lockout"
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "NORMAL"
        -
          condition: "state"
          entity_id: "input_boolean.topny_system_enable"
          state: "on"
        -
          condition: "state"
          entity_id: "binary_sensor.kotel_should_be_on"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "off"
        -
          condition: "state"
          entity_id: "switch.kotel_rele_spinac"
          state: "off"
          for:
            minutes: 10
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_no_heat"
            title: "Topení – požadavek bez kotle"
            message: "Je požadavek na teplo, ale relé je nejméně 10 minut OFF; režim {{ states('input_select.heating_flow_state_v4') }}, aktivní zóny {{ states('sensor.kotel_aktivni_zony_pocet') }}, průměrná poptávka {{ states('sensor.kotel_poptavka_prumer') }} %."
        -
          if:
            -
              condition: "trigger"
              id:
                - "relay_stopped"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – provozní alarm"
                message: "Je požadavek na teplo, ale relé je nejméně 10 minut OFF; režim {{ states('input_select.heating_flow_state_v4') }}, aktivní zóny {{ states('sensor.kotel_aktivni_zony_pocet') }}, průměrná poptávka {{ states('sensor.kotel_poptavka_prumer') }} %."
      else:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_watchdog_no_heat"
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "NORMAL"
        -
          condition: "state"
          entity_id: "input_boolean.topny_system_enable"
          state: "on"
        -
          condition: "state"
          entity_id: "binary_sensor.kotel_should_be_on"
          state: "on"
        -
          condition: "state"
          entity_id: "switch.kotel_rele_spinac"
          state: "on"
        -
          condition: "state"
          entity_id: "binary_sensor.boiler_burngas"
          state: "off"
          for:
            minutes: 15
        -
          condition: "numeric_state"
          entity_id: "sensor.boiler_heatblock"
          below: 40
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_no_flame"
            title: "Topení – kotel nehřeje"
            message: "Požadavek na teplo je aktivní, relé ON, ale hořák nejméně 15 minut OFF a kotlový blok pod 40 °C. Prověřte EMS a palivovou regulaci."
        -
          if:
            -
              condition: "trigger"
              id:
                - "burn_stopped"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – provozní alarm"
                message: "Požadavek na teplo je aktivní, relé ON, ale hořák nejméně 15 minut OFF a kotlový blok pod 40 °C. Prověřte EMS a palivovou regulaci."
      else:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_watchdog_no_flame"
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "state"
              entity_id: "sensor.system_bus_status"
              state: "connected"
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_ems_offline"
            title: "Topení – chyba komunikace EMS"
            message: "EMS komunikace není potvrzená: {{ states('sensor.system_bus_status') }}. Vyhodnocení kotle a průtoku může být nespolehlivé."
        -
          if:
            -
              condition: "trigger"
              id:
                - "bus_disconnect"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – provozní alarm"
                message: "EMS komunikace není potvrzená: {{ states('sensor.system_bus_status') }}. Vyhodnocení kotle a průtoku může být nespolehlivé."
      else:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_watchdog_ems_offline"
    -
      if:
        -
          condition: "state"
          entity_id: "sensor.boiler_servicecodenumber"
          state:
            - "2964"
            - "2965"
            - "2966"
            - "2967"
      then:
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_watchdog_ems_fault"
            title: "Topení – nová porucha kotle 2964–2967"
            message: "Topení: EMS právě nahlásil poruchu {{ states('sensor.boiler_servicecodenumber') }}. Výstup {{ states('sensor.boiler_curflowtemp') }} °C, Flow V4 {{ states('input_select.heating_flow_state_v4') }}, relé {{ states('switch.kotel_rele_spinac') }}. U kódů 2964–2967 zkontrolujte hydraulickou cestu, pumpu a tlak; neobcházejte blokaci."
        -
          if:
            -
              condition: "trigger"
              id:
                - "fault_2964"
                - "fault_2965"
                - "fault_2966"
                - "fault_2967"
          then:
            -
              action: "notify.mobile_app_sm_s938b"
              data:
                title: "Topení – porucha kotle"
                message: "Topení: EMS právě nahlásil poruchu {{ states('sensor.boiler_servicecodenumber') }}. Výstup {{ states('sensor.boiler_curflowtemp') }} °C, Flow V4 {{ states('input_select.heating_flow_state_v4') }}, relé {{ states('switch.kotel_rele_spinac') }}. U kódů 2964–2967 zkontrolujte hydraulickou cestu, pumpu a tlak; neobcházejte blokaci."
  initial_state: true
-
  id: "1791543743116"
  alias: "Topení V4 – periodická kontrola pouze nouzového chlazení"
  description: "Samostatný minutový kontrolní impuls pouze během EMERGENCY_COOLING. Nenarušuje vícefázový RESTORING Flow V4 (který má mode restart); při aktivní ochraně pravidelně vyvolá reconcile, aby po potvrzení průtokových cest či timeoutu mohl nastat další krok. Bez přímého ovládání kotle a bez obcházení lockoutu."
  mode: "single"
  trigger:
    -
      trigger: "time_pattern"
      minutes: "/1"
  condition:
    -
      condition: "state"
      entity_id: "input_select.heating_flow_state_v4"
      state: "EMERGENCY_COOLING"
  action:
    -
      event: "heating_flow_v4_reconcile"
      event_data:
        source: "emergency_only_periodic_tick"
  initial_state: true
-
  id: "1791544279063"
  alias: "Topení V4 – watchdog dlouhé obnovy"
  description: "Pouze pasivní dohled. Pokud RESTORING trvá 10 minut bez návratu do NORMAL či HARD_LOCKOUT, zobrazí stabilní oznámení a odešle jednorázové mobilní upozornění. Nedává žádné povely kotli, hlavicím, servisním režimům ani state machine."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "input_select.heating_flow_state_v4"
      to: "RESTORING"
      for:
        minutes: 10
      id: "restoring_stuck"
    -
      trigger: "state"
      entity_id: "input_select.heating_flow_state_v4"
      to: "NORMAL"
      id: "cleared_normal"
    -
      trigger: "state"
      entity_id: "input_select.heating_flow_state_v4"
      to: "HARD_LOCKOUT"
      id: "cleared_lockout"
  condition:
    []
  action:
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "restoring_stuck"
          sequence:
            -
              action: "persistent_notification.create"
              data:
                notification_id: "heating_v4_restoring_stuck"
                title: "Topení – obnova trvá déle než 10 minut"
                message: "Flow V4 zůstává v RESTORING >10 min, relé {{ states('switch.kotel_rele_spinac') }}, master {{ states('input_boolean.topny_system_enable') }}, fault-clear {{ states('binary_sensor.heating_boiler_fault_clear') }}, EMS {{ states('sensor.system_bus_status') }}, potvrzení hlavic {{ states('input_boolean.heating_restore_verified') }}. Příčinu ověřte v trace skriptu. Kotel nezapínám."
            -
              action: "notify.mobile_app_sm_s938b"
              continue_on_error: true
              data:
                title: "Topení – obnova se zasekla"
                message: "Flow V4 >10 min v RESTORING. EMS kód: {{ states('sensor.boiler_servicecodenumber') }}, heatblock: {{ states('sensor.boiler_heatblock') }} °C. Kotel není automaticky odblokován."
      default:
        -
          action: "persistent_notification.dismiss"
          data:
            notification_id: "heating_v4_restoring_stuck"
  initial_state: true
-
  id: "heating_flow_relief_fault_recovery_reconciler_v2"
  alias: "Topení – flow relief fault recovery reconciler V2"
  description: "Restart-safe recovery V3: při pending poruše drží kotel vypnutý, čeká bez pevného časového limitu na bezpečné vychladnutí bloku pod 60 °C, ověří fault-clear/EMS/průtokové cesty, obnoví všech 8 zón podle aktuálního normálního režimu a teprve potom obnoví původní povolení topení."
  mode: "single"
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      to: "on"
      id: "pending_on"
    -
      trigger: "time_pattern"
      minutes: "/1"
      id: "minute"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_boiler_fault_clear"
      to: "on"
      id: "fault_clear"
    -
      trigger: "state"
      entity_id: "sensor.system_bus_status"
      to: "connected"
      id: "bus_ok"
    -
      trigger: "state"
      entity_id: "binary_sensor.boiler_burngas"
      to: "off"
      id: "burner_off"
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      below: 60
      id: "cool"
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_flow_relief_fault_paths_confirmed"
      to: "on"
      id: "paths"
  condition:
    -
      condition: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      state: "on"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_enabled"
      state: "on"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_resume_armed"
      state: "on"
    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "on"
  action:
    -
      if:
        -
          condition: "template"
          value_template: "{% set ts = state_attr('input_datetime.heating_flow_relief_last_fault','timestamp') %} {{ ts is none or not is_number(ts) }}"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_flow_relief_lockout"
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_flow_relief_invalid_fault_timestamp"
            title: "Topení – recovery zablokována"
            message: "Fault recovery nemá platný persistentní čas poslední poruchy. Aktivován lockout; automatický restart se neprovede."
        -
          stop: "Neplatný last_fault timestamp."
    -
      condition: "state"
      entity_id: "binary_sensor.heating_boiler_fault_clear"
      state: "on"
    -
      condition: "state"
      entity_id: "sensor.system_bus_status"
      state: "connected"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_burngas"
      state: "off"
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "numeric_state"
              entity_id: "sensor.boiler_heatblock"
              below: 60
      then:
        -
          action: "logbook.log"
          data:
            name: "Topení – recovery V3"
            entity_id: "sensor.boiler_heatblock"
            message: "Kotel ještě není pod 60 °C. Kotel zůstává OFF a hlavice zůstávají dočasně otevřené; další trigger recovery stav znovu vyhodnotí."
        -
          stop: "Čekám na vychladnutí kotle pod 60 °C."
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "state"
              entity_id: "binary_sensor.heating_flow_relief_fault_paths_confirmed"
              state: "on"
      then:
        -
          wait_for_trigger:
            -
              trigger: "state"
              entity_id: "binary_sensor.heating_flow_relief_fault_paths_confirmed"
              to: "on"
          timeout: "00:02:00"
          continue_on_timeout: true
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "state"
              entity_id: "binary_sensor.heating_flow_relief_fault_paths_confirmed"
              state: "on"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_flow_relief_lockout"
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_flow_relief_fault_no_paths"
            title: "Topení – otevření hlavic nepotvrzeno"
            message: "Ani po čekání nebyly explicitně potvrzeny alespoň dvě průtokové cesty. Aktivován lockout."
        -
          stop: "Průtoková cesta po poruše není ověřena."
    -
      condition: "state"
      entity_id: "binary_sensor.heating_boiler_fault_clear"
      state: "on"
    -
      condition: "state"
      entity_id: "sensor.system_bus_status"
      state: "connected"
    -
      condition: "state"
      entity_id: "binary_sensor.boiler_burngas"
      state: "off"
    -
      condition: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      below: 60
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      state: "off"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_restore_verified"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_service_mode"
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.heating_restore_verified"
              state: "on"
      then:
        -
          wait_for_trigger:
            -
              trigger: "state"
              entity_id: "input_boolean.heating_restore_verified"
              to: "on"
          timeout: "00:03:00"
          continue_on_timeout: true
    -
      if:
        -
          condition: "not"
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.heating_restore_verified"
              state: "on"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.topny_system_enable"
          continue_on_error: true
        -
          action: "switch.turn_off"
          target:
            entity_id: "switch.kotel_rele_spinac"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
