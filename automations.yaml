set old=r.get('before',{}) %}{% set new=r.get('after',{}) %}\n    {% if rt<ns.p.l or rt>t+5 or t-rt>30 %}\n      {% set ns.events=ns.events+[dict(kind='pair_out_of_order',event_at=rt)] %}\n    {% elif new.get('state') not in ['heat','off'] %}\n      {% set ns.events=ns.events+[dict(kind='pair_interrupted',reason='zone_unavailable',pending=ns.p)] %}\n      {% set ns.p={} %}\n    {% elif is_number(new.get('target')) and new.get('target')!=old.get('target') and (new.target|float-ns.p.v)|abs>=0.05 %}\n      {% set ns.events=ns.events+[dict(kind='pair_diverged',reported_target=new.target,pending=ns.p)] %}\n      {% set ns.p={} %}\n    {% else %}\n      {% set was_complete=ns.p.a is not none and ns.p.p is not none %}\n      {% if ns.p.a is none and is_number(new.get('target')) and new.get('target')!=old.get('target') and (new.target|float-ns.p.v)|abs<0.05 %}\n        {% set ns.p=dict(ns.p,a=(rt-ns.p.t)|round(3)) %}\n        {% set ns.events=ns.events+[dict(kind='pair_target_reported',delay_s=ns.p.a,pending=ns.p)] %}\n      {% endif %}\n      {% if ns.p.p is none and is_number(new.get('demand')) and is_number(old.get('demand')) and new.demand!=old.demand %}\n        {% set ns.p=dict(ns.p,p=(rt-ns.p.t)|round(3)) %}\n        {% set ns.events=ns.events+[dict(kind='pair_pi_changed',delay_s=ns.p.p,old_pi=old.demand,new_pi=new.demand,pending=ns.p)] %}\n      {% endif %}\n      {% if not was_complete and ns.p.a is not none and ns.p.p is not none %}\n        {% set ns.events=ns.events+[dict(kind='pair_complete',pending=ns.p)] %}\n      {% endif %}\n    {% endif %}\n  {% endif %}\n{% endif %}\n{{ dict(next=ns.p,events=ns.events)|to_json|from_json }}\n"
    -
      if:
        -
          condition: "template"
          value_template: "{{ result.next != p }}"
      then:
        -
          action: "input_text.set_value"
          target:
            entity_id: "input_text.heating_pair_2p_mama"
          data:
            value: "v2:{{ result.next|to_json }}"
    -
      repeat:
        for_each: "{{ result.events }}"
        sequence:
          -
            action: "logbook.log"
            data:
              name: "Topení – párování DATA"
              message: "{{ dict(schema='heating_pair_v2',entity=z,captured_at=t,physical_valve_position_confirmed=false,causal_match_confirmed=false,event=repeat.item)|to_json }}"
          -
            action: "logbook.log"
            data:
              name: "Topení – párování"
              message: "{% set e=repeat.item %}{% set names={'pair_started':'Povel zařazen','pair_duplicate':'Opakovaný povel','pair_target_reported':'Změna cíle hlášena','pair_pi_changed':'Změna PI hlášena','pair_complete':'Obě hlášení zachycena','pair_timeout':'Párování neúplné po 10 min','pair_superseded':'Nahrazeno novým povelem','pair_diverged':'Hlášen jiný cíl','pair_interrupted':'Párování přerušeno','pair_out_of_order':'Opožděná nebo přeházená událost','pair_unsupported':'Nepodporovaný povel'} %}{{ state_attr(z,'friendly_name') or z }}: {{ names.get(e.kind,e.kind) }}.{% if e.get('delay_s') is not none %} Za {{ e.delay_s|round(1) }} s od prvního povelu.{% endif %}{% if e.kind=='pair_complete' %} Cíl {{ e.pending.a|round(1) }} s; změna PI {{ e.pending.p|round(1) }} s; povelů {{ e.pending.n }}.{% endif %} Jde o časovou souvislost hlášení, ne potvrzení pohybu ventilu."
              entity_id: "sensor.heating_observer_learning"
    -
      action: "input_text.set_value"
