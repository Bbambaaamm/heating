  alias: "Topení – pozorování do poruchy 20260920"
  description: "Pasivní záznam od 20.9.2026: při změnách a po 30 sekundách zapisuje stav hlavic a kotle do deníku. Nemění řízení, hlavice ani kotel. Vypne jej související záchyt nové poruchy."
