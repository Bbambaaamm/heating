                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_relief_lockout"
                  state: "off"
                -
                  condition: "state"
                  entity_id: "binary_sensor.heating_boiler_fault_clear"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "sensor.system_bus_status"
                  state: "connected"
                -
                  condition: "state"
                  entity_id: "binary_sensor.boiler_burngas"
                  state: "off"
                -
                  condition: "numeric_state"
                  entity_id: "sensor.boiler_heatblock"
                  below: 72
                -
                  condition: "state"
                  entity_id: "input_select.topny_rezim"
                  state:
                    - "Auto"
                    - "Eco"
                    - "Boost"
              then:
                -
                  action: "input_boolean.turn_on"
                  target:
                    entity_id: "input_boolean.topny_system_enable"
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – servisní režim"
                    entity_id: "input_boolean.topny_system_enable"
                    message: "Ruční servis skončil; obnovení hlavic potvrzeno, EMS bez chyby a původní master byl ON. Povoluji automatické topení; relé spouští výhradně bezpečná V4 politika po 120 s."
              else:
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – servisní režim"
                    entity_id: "input_boolean.topny_system_enable"
                    message: "Po ukončení servisu zůstává master OFF: před servisem byl vypnutý, nebo obnova/bezpečnostní podmínky nejsou potvrzené. Bez ručního obejití blokací."
  initial_state: true
-
  id: "heating_service_mode_hard_guard"
  alias: "Topení – servisní režim: okamžitá ochrana relé"
  description: "Nezávislá bezpečnostní pojistka servisního režimu. Pomalé nebo chybující povely Zigbee hlavic nesmějí zdržet vypnutí kotlového relé a hlavního povolení. Relé zůstává blokované také během obnovy rozvrhů."
  mode: "parallel"
  max: 10
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      to: "on"
      id: "relay_on"
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      to: "on"
      id: "main_on"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "state"
      entity_id: "script.heating_restore_schedule_after_service"
      to: "on"
      id: "schedule_restore"
  condition:
    -
      condition: "or"
      conditions:
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "on"
        -
          condition: "state"
          entity_id: "script.heating_restore_schedule_after_service"
          state: "on"
  action:
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
  initial_state: true
-
  id: "heating_boiler_low_flow_hard_guard"
  alias: "Topení – ochrana při nedostatečném průtoku kotlem"
  description: "Tvrdý fail-closed guard pro kódy 2964–2967: nejdřív zablokuje hlavní řízení, nezávisle vypne relé a zapne servisní režim. Jednotlivé selhání výstupního povelu nesmí zabránit dalšímu bezpečnostnímu kroku."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "2967"
  condition:
    []
  action:
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_restore_verified"
    -
      action: "input_boolean.turn_on"
      target:
        entity_id: "input_boolean.heating_service_mode"
    -
      action: "persistent_notification.create"
      data:
        notification_id: "heating_boiler_low_flow_guard"
        title: "Topení zastaveno – nedostatečný průtok"
        message: "Kotel ohlásil servisní kód {{ trigger.id }}. Relé a hlavní řízení byly vypnuty a servisní režim otevře chytré hlavice. Manuální ventily ponechte otevřené a před dalším spuštěním zkontrolujte průtok."
  initial_state: false
-
  id: "1790189549824"
  alias: "Topení – flow relief paměť povolení"
  description: "Pamatuje původní povolení topení. Automatické vypnutí během Flow V4 resume_armed nemaže; ruční vypnutí uživatelem jej zruší. Paměť se synchronizuje z masteru pouze ve stavu NORMAL."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      id: "master"
    -
      trigger: "homeassistant"
      event: "start"
      id: "start"
  condition:
    []
  action:
    -
      if:
        -
          condition: "trigger"
          id: "master"
      then:
        -
          delay:
            seconds: 2
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "master"
            -
              condition: "template"
              value_template: "{{ trigger.to_state is not none and trigger.to_state.state == 'off' and trigger.to_state.context is not none and trigger.to_state.context.user_id is not none }}"
          sequence:
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
                message: "Ruční vypnutí hlavního topení zrušilo automatické obnovení po poruše."
            -
              stop: "Ruční vypnutí má prioritu."
    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_select.heating_flow_state_v4"
      state: "NORMAL"
    -
      condition: "not"
      conditions:
        -
          condition: "state"
          entity_id: "sensor.boiler_servicecodenumber"
          state:
            - "2964"
            - "2965"
            - "2966"
            - "2967"
    -
      choose:
        -
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.topny_system_enable"
              state: "on"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
        -
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.topny_system_enable"
              state: "off"
          sequence:
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
  initial_state: true
-
  id: "1790189552180"
  alias: "Topení – flow relief blokuje relé a hlavní řízení"
  description: "Tvrdý interlock V2 blokuje hlavní povolení a relé při aktivním flow-relief, lockoutu i pending fault recovery. Restart uprostřed hydraulického flow přechází do lockoutu; restart během čekání po poruše bezpečně pokračuje v persistentní recovery."
  mode: "parallel"
  max: 10
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      to: "on"
      id: "relay_on"
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      to: "on"
      id: "master_on"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_flow_relief_mode"
      to: "on"
      id: "mode_on"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      to: "on"
      id: "lockout_on"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      to: "on"
      id: "recovery_pending_on"
  condition:
    -
      condition: "or"
      conditions:
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_mode"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_lockout"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_fault_recovery_pending"
          state: "on"
  action:
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "ha_start"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_mode"
              state: "on"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_lockout"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_service_mode"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
            -
              action: "persistent_notification.create"
              data:
                notification_id: "heating_flow_relief_restart_guard"
                title: "Topení – flow relief přerušen restartem"
                message: "Home Assistant se restartoval během aktivního hydraulického interlocku. Aktivoval se servisní lockout."
        -
          conditions:
            -
              condition: "trigger"
              id: "ha_start"
            -
              condition: "state"
              entity_id: "input_boolean.heating_fault_recovery_pending"
              state: "on"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_lockout"
              state: "off"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_service_mode"
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "input_boolean.heating_fault_recovery_pending"
                message: "Po restartu HA obnoveno čekání na fault recovery; AUTO a relé zůstávají blokované."
    -
      if:
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_lockout"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "off"
      then:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_service_mode"
  initial_state: false
-
  id: "1790189620167"
  alias: "Topení – Flow-relief V4 state-machine"
  description: 'Jediný vlastník nouzového chlazení a recovery. Stavy: NORMAL → EMERGENCY_COOLING → RESTORING → NORMAL/HARD_LOCKOUT. V emergency drží kotel OFF, otevírá hlavice jednou ve dvou dávkách, po vychladnutí pod 60 °C vždy vrátí hlavice do normálních cílů. Kotel se znovu povolí jen při ověřených průtokových cestách, fault-clear, EMS connected a pokud byl před incidentem povolený. Restart HA zachovává fyzický stav a pokračuje v recovery. Interní přechody používají explicitní event; změna state helperu nikdy sama nerestartuje bezpečnostní sekvenci. Startup reconciliation umí vstoupit do emergency i z již aktivního fault/heat stavu. Oprava 2026-10-09: po ochlazeni nepokračuj do RESTORING bez potvrzenych cest pred uplynutim celeho 120s testu. Zabraní falesnemu HARD_LOCKOUT pri rychlem ochlazeni; chybejici průtok po timeoutu dál zůstane blokovaný. Oprava 2026-10-09 #2: minutový poll přesunut do samostatné emergency-only automatizace, aby nemohl zrušit RESTORING; úspěšná obnova čistí dočasné potvrzení hydraulických cest. Oprava 2026-10-19: V RESTORING počká až 3 min na přechod boiler fault-clear do ON, než vyhodnotí HARD_LOCKOUT; řeší závod při odeznění kódu 2964 a vrácení hlavic. Oprava 2026-10-21: přechodná překážka při RESTORING ponechá relé OFF a opakuje kontrolu po odeznění; nevytváří trvalý lockout. Ověřené cíle hlavic se při opakované kontrole znovu nepřepisují. Oprava 2026-10-24: softwarový zámek vždy vyprší do 10 minut; aktivní přehřátí/porucha zůstávají nezávislou překážkou normálního startu.'
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_flow_relief_r2"
      to: "on"
      for:
        seconds: 20
      id: "r2_20s"
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      above: 72
      for:
        seconds: 10
      id: "heatblock_72"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "fault_2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "fault_2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "fault_2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "fault_2967"
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      below: 60
      id: "cooled"
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_flow_relief_confirmed"
      to: "on"
      id: "paths_confirmed"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_service_mode"
      to: "on"
      id: "service_attempt"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "event"
      event_type: "automation_reloaded"
      id: "automation_reload"
    -
      trigger: "event"
      event_type: "heating_flow_v4_reconcile"
      id: "reconcile"
    -
      trigger: "state"
      entity_id:
        - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
        - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
        - "automation.topeni_flow_relief_timeout_guard"
        - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
        - "automation.topeni_flow_relief_obnova_po_poruse"
        - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
        - "automation.kotel_zapnout_pri_splneni_politiky"
      to: "on"
      id: "legacy_reenabled"
    -
      trigger: "event"
      event_type: "heating_flow_v4_force_emergency"
      id: "force_emergency"
    - trigger: event
      event_type: heating_flow_v4_lockout_expired
      id: lockout_expired
  condition:
    # Benign progress events must not restart an in-flight opening batch.
    # RESTORING handoffs and urgent safety triggers retain restart behavior.
    -
      condition: "template"
      value_template: >-
        {{ not ((trigger.id | default('')) in ['reconcile', 'paths_confirmed', 'cooled'] and is_state('input_select.heating_flow_state_v4', 'EMERGENCY_COOLING') and (this.attributes.current | default(0) | int(0)) > 0) }}
  action:
    -
      if:
        -
          condition: "trigger"
          id: "legacy_reenabled"
      then:
        -
          action: "automation.turn_off"
          target:
            entity_id:
              - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
              - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
              - "automation.topeni_flow_relief_timeout_guard"
              - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
              - "automation.topeni_flow_relief_obnova_po_poruse"
              - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
              - "automation.kotel_zapnout_pri_splneni_politiky"
          data:
            stop_actions: true
          continue_on_error: true
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "input_select.heating_flow_state_v4"
            message: "Legacy topná větev se pokusila znovu aktivovat; V4 ji okamžitě vypnula."
        -
          stop: "Legacy větev znovu vypnuta."
    -
      if:
        -
          condition: "trigger"
          id:
            - "ha_start"
            - "automation_reload"
      then:
        -
          action: "automation.turn_off"
          target:
            entity_id:
              - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
              - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
              - "automation.topeni_flow_relief_timeout_guard"
              - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
              - "automation.topeni_flow_relief_obnova_po_poruse"
              - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
              - "automation.kotel_zapnout_pri_splneni_politiky"
          data:
            stop_actions: true
          continue_on_error: true
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "RESTORING"
          then:
            -
              action: "input_select.select_option"
              target:
                entity_id: "input_select.heating_flow_state_v4"
              data:
                option: "EMERGENCY_COOLING"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "NORMAL"
            -
              condition: "state"
              entity_id: "input_boolean.heating_service_mode"
              state: "off"
            -
              condition: "or"
              conditions:
                -
                  condition: "state"
                  entity_id: "sensor.boiler_servicecodenumber"
                  state:
                    - "2964"
                    - "2965"
                    - "2966"
                    - "2967"
                -
                  condition: "numeric_state"
                  entity_id: "sensor.boiler_heatblock"
                  above: 72
          then:
            -
              event: "heating_flow_v4_force_emergency"
              event_data:
                source: "startup_reconcile"
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "EMERGENCY_COOLING"
          then:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.topny_system_enable"
              continue_on_error: true
            -
              action: "switch.turn_off"
              target:
                entity_id: "switch.kotel_rele_spinac"
              continue_on_error: true
            -
              action: "climate.set_hvac_mode"
              target:
                entity_id:
                  - "climate.1p_jidelna"
                  - "climate.sklep_michal"
                  - "climate.2p_mama"
                  - "climate.prizemi_michal"
              data:
                hvac_mode: "heat"
              continue_on_error: true
            -
              action: "climate.set_temperature"
              target:
                entity_id:
                  - "climate.1p_jidelna"
                  - "climate.sklep_michal"
                  - "climate.2p_mama"
                  - "climate.prizemi_michal"
              data:
                temperature: 29
              continue_on_error: true
            -
              delay:
                seconds: 2
            -
              action: "climate.set_hvac_mode"
              target:
                entity_id:
                  - "climate.prizemi_chodba_zachod"
                  - "climate.1p_kuchyn"
                  - "climate.1p_koupelna"
                  - "climate.1p_chodba"
              data:
                hvac_mode: "heat"
              continue_on_error: true
            -
              action: "climate.set_temperature"
              target:
                entity_id:
                  - "climate.prizemi_chodba_zachod"
                  - "climate.1p_kuchyn"
                  - "climate.1p_koupelna"
                  - "climate.1p_chodba"
              data:
                temperature: 29
              continue_on_error: true
            -
              if:
                -
                  condition: "state"
                  entity_id: "binary_sensor.heating_flow_relief_confirmed"
                  state: "on"
              then:
                -
                  action: "input_boolean.turn_on"
                  target:
                    entity_id: "input_boolean.heating_flow_paths_verified_v4"
    -
      if:
        -
          condition: "trigger"
          id: "paths_confirmed"
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "EMERGENCY_COOLING"
      then:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_flow_paths_verified_v4"
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "input_boolean.heating_flow_paths_verified_v4"
            message: "Potvrzeny alespoň dvě nouzové průtokové cesty."
    -
      if:
        -
          condition: "trigger"
          id:
            - "r2_20s"
            - "heatblock_72"
            - "fault_2964"
            - "fault_2965"
            - "fault_2966"
            - "fault_2967"
            - "force_emergency"
        -
          condition: "state"
