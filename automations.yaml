                    -
                      sequence:
                        -
                          action: "climate.set_hvac_mode"
                          target:
                            entity_id: "climate.prizemi_michal"
                          data:
                            hvac_mode: "heat"
                          continue_on_error: true
                        -
                          action: "climate.set_temperature"
                          target:
                            entity_id: "climate.prizemi_michal"
                          data:
                            temperature: 29
                          continue_on_error: true
                    -
                      sequence:
                        -
                          action: "climate.set_hvac_mode"
                          target:
                            entity_id: "climate.prizemi_chodba_zachod"
                          data:
                            hvac_mode: "heat"
                          continue_on_error: true
                        -
                          action: "climate.set_temperature"
                          target:
                            entity_id: "climate.prizemi_chodba_zachod"
                          data:
                            temperature: 29
                          continue_on_error: true
                    -
                      sequence:
                        -
                          action: "climate.set_hvac_mode"
                          target:
                            entity_id: "climate.1p_kuchyn"
                          data:
