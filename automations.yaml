                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_relief_lockout"
                  state: "off"
                -
                  condition: "state"
                  entity_id: "binary_sensor.heating_boiler_fault_clear"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "sensor.system_bus_status"
                  state: "connected"
                -
                  condition: "state"
                  entity_id: "binary_sensor.boiler_burngas"
                  state: "off"
                -
                  condition: "numeric_state"
                  entity_id: "sensor.boiler_heatblock"
                  below: 72
                -
                  condition: "state"
                  entity_id: "input_select.topny_rezim"
                  state:
                    - "Auto"
                    - "Eco"
                    - "Boost"
              then:
                -
                  action: "input_boolean.turn_on"
                  target:
                    entity_id: "input_boolean.topny_system_enable"
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – servisní režim"
                    entity_id: "input_boolean.topny_system_enable"
                    message: "Ruční servis skončil; obnovení hlavic potvrzeno, EMS bez chyby a původní master byl ON. Povoluji automatické topení; relé spouští výhradně bezpečná V4 politika po 120 s."
              else:
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – servisní režim"
                    entity_id: "input_boolean.topny_system_enable"
                    message: "Po ukončení servisu zůstává master OFF: před servisem byl vypnutý, nebo obnova/bezpečnostní podmínky nejsou potvrzené. Bez ručního obejití blokací."
  initial_state: true
-
  id: "heating_service_mode_hard_guard"
  alias: "Topení – servisní režim: okamžitá ochrana relé"
  description: "Nezávislá bezpečnostní pojistka servisního režimu. Pomalé nebo chybující povely Zigbee hlavic nesmějí zdržet vypnutí kotlového relé a hlavního povolení. Relé zůstává blokované také během obnovy rozvrhů."
  mode: "parallel"
  max: 10
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      to: "on"
      id: "relay_on"
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      to: "on"
      id: "main_on"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "state"
      entity_id: "script.heating_restore_schedule_after_service"
      to: "on"
      id: "schedule_restore"
  condition:
    -
      condition: "or"
      conditions:
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "on"
        -
          condition: "state"
          entity_id: "script.heating_restore_schedule_after_service"
          state: "on"
  action:
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
  initial_state: true
-
  id: "heating_boiler_low_flow_hard_guard"
  alias: "Topení – ochrana při nedostatečném průtoku kotlem"
  description: "Tvrdý fail-closed guard pro kódy 2964–2967: nejdřív zablokuje hlavní řízení, nezávisle vypne relé a zapne servisní režim. Jednotlivé selhání výstupního povelu nesmí zabránit dalšímu bezpečnostnímu kroku."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "2967"
  condition:
    []
  action:
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_restore_verified"
    -
      action: "input_boolean.turn_on"
      target:
        entity_id: "input_boolean.heating_service_mode"
    -
      action: "persistent_notification.create"
      data:
        notification_id: "heating_boiler_low_flow_guard"
        title: "Topení zastaveno – nedostatečný průtok"
        message: "Kotel ohlásil servisní kód {{ trigger.id }}. Relé a hlavní řízení byly vypnuty a servisní režim otevře chytré hlavice. Manuální ventily ponechte otevřené a před dalším spuštěním zkontrolujte průtok."
  initial_state: false
-
  id: "1790189549824"
  alias: "Topení – flow relief paměť povolení"
  description: "Pamatuje původní povolení topení. Automatické vypnutí během Flow V4 resume_armed nemaže; ruční vypnutí uživatelem jej zruší. Paměť se synchronizuje z masteru pouze ve stavu NORMAL."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      id: "master"
    -
      trigger: "homeassistant"
      event: "start"
      id: "start"
  condition:
    []
  action:
    -
      if:
        -
          condition: "trigger"
          id: "master"
      then:
        -
          delay:
            seconds: 2
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "master"
            -
              condition: "template"
              value_template: "{{ trigger.to_state is not none and trigger.to_state.state == 'off' and trigger.to_state.context is not none and trigger.to_state.context.user_id is not none }}"
          sequence:
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
                message: "Ruční vypnutí hlavního topení zrušilo automatické obnovení po poruše."
            -
              stop: "Ruční vypnutí má prioritu."
    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_boolean.heating_flow_relief_mode"
      state: "off"
    -
      condition: "state"
      entity_id: "input_select.heating_flow_state_v4"
      state: "NORMAL"
    -
      condition: "not"
      conditions:
        -
          condition: "state"
          entity_id: "sensor.boiler_servicecodenumber"
          state:
            - "2964"
            - "2965"
            - "2966"
            - "2967"
    -
      choose:
        -
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.topny_system_enable"
              state: "on"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
        -
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.topny_system_enable"
              state: "off"
          sequence:
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_resume_armed"
  initial_state: true
-
  id: "1790189552180"
  alias: "Topení – flow relief blokuje relé a hlavní řízení"
  description: "Tvrdý interlock V2 blokuje hlavní povolení a relé při aktivním flow-relief, lockoutu i pending fault recovery. Restart uprostřed hydraulického flow přechází do lockoutu; restart během čekání po poruše bezpečně pokračuje v persistentní recovery."
  mode: "parallel"
  max: 10
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "switch.kotel_rele_spinac"
      to: "on"
      id: "relay_on"
    -
      trigger: "state"
      entity_id: "input_boolean.topny_system_enable"
      to: "on"
      id: "master_on"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_flow_relief_mode"
      to: "on"
      id: "mode_on"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_flow_relief_lockout"
      to: "on"
      id: "lockout_on"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_fault_recovery_pending"
      to: "on"
      id: "recovery_pending_on"
  condition:
    -
      condition: "or"
      conditions:
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_mode"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_lockout"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_fault_recovery_pending"
          state: "on"
  action:
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "ha_start"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_mode"
              state: "on"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_lockout"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_service_mode"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
            -
              action: "persistent_notification.create"
              data:
                notification_id: "heating_flow_relief_restart_guard"
                title: "Topení – flow relief přerušen restartem"
                message: "Home Assistant se restartoval během aktivního hydraulického interlocku. Aktivoval se servisní lockout."
        -
          conditions:
            -
              condition: "trigger"
              id: "ha_start"
            -
              condition: "state"
              entity_id: "input_boolean.heating_fault_recovery_pending"
              state: "on"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_lockout"
              state: "off"
          sequence:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_service_mode"
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "input_boolean.heating_fault_recovery_pending"
                message: "Po restartu HA obnoveno čekání na fault recovery; AUTO a relé zůstávají blokované."
    -
      if:
        -
          condition: "state"
          entity_id: "input_boolean.heating_flow_relief_lockout"
          state: "on"
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "off"
      then:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_service_mode"
  initial_state: false
-
  id: "1790189620167"
  alias: "Topení – Flow-relief V4 state-machine"
  description: "Jediný vlastník nouzového chlazení a recovery. Stavy: NORMAL → EMERGENCY_COOLING → RESTORING → NORMAL/HARD_LOCKOUT. V emergency drží kotel OFF, otevírá hlavice jednou ve dvou dávkách, po vychladnutí pod 60 °C vždy vrátí hlavice do normálních cílů. Kotel se znovu povolí jen při ověřených průtokových cestách, fault-clear, EMS connected a pokud byl před incidentem povolený. Restart HA zachovává fyzický stav a pokračuje v recovery. Interní přechody používají explicitní event; změna state helperu nikdy sama nerestartuje bezpečnostní sekvenci. Startup reconciliation umí vstoupit do emergency i z již aktivního fault/heat stavu. Oprava 2026-10-09: po ochlazeni nepokračuj do RESTORING bez potvrzenych cest pred uplynutim celeho 120s testu. Zabraní falesnemu HARD_LOCKOUT pri rychlem ochlazeni; chybejici průtok po timeoutu dál zůstane blokovaný. Oprava 2026-10-09 #2: minutový poll přesunut do samostatné emergency-only automatizace, aby nemohl zrušit RESTORING; úspěšná obnova čistí dočasné potvrzení hydraulických cest."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_flow_relief_r2"
      to: "on"
      for:
        seconds: 20
      id: "r2_20s"
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      above: 72
      for:
        seconds: 10
      id: "heatblock_72"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "fault_2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "fault_2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "fault_2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "fault_2967"
    -
      trigger: "numeric_state"
      entity_id: "sensor.boiler_heatblock"
      below: 60
      id: "cooled"
    -
      trigger: "state"
      entity_id: "binary_sensor.heating_flow_relief_confirmed"
      to: "on"
      id: "paths_confirmed"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_service_mode"
      to: "on"
      id: "service_attempt"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
    -
      trigger: "event"
      event_type: "automation_reloaded"
      id: "automation_reload"
    -
      trigger: "event"
      event_type: "heating_flow_v4_reconcile"
      id: "reconcile"
    -
      trigger: "state"
      entity_id:
        - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
        - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
        - "automation.topeni_flow_relief_timeout_guard"
        - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
        - "automation.topeni_flow_relief_obnova_po_poruse"
        - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
        - "automation.kotel_zapnout_pri_splneni_politiky"
      to: "on"
      id: "legacy_reenabled"
    -
      trigger: "event"
      event_type: "heating_flow_v4_force_emergency"
      id: "force_emergency"
  condition:
    []
  action:
    -
      if:
        -
          condition: "trigger"
          id: "legacy_reenabled"
      then:
        -
          action: "automation.turn_off"
          target:
            entity_id:
              - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
              - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
              - "automation.topeni_flow_relief_timeout_guard"
              - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
              - "automation.topeni_flow_relief_obnova_po_poruse"
              - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
              - "automation.kotel_zapnout_pri_splneni_politiky"
          data:
            stop_actions: true
          continue_on_error: true
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "input_select.heating_flow_state_v4"
            message: "Legacy topná větev se pokusila znovu aktivovat; V4 ji okamžitě vypnula."
        -
          stop: "Legacy větev znovu vypnuta."
    -
      if:
        -
          condition: "trigger"
          id:
            - "ha_start"
            - "automation_reload"
      then:
        -
          action: "automation.turn_off"
          target:
            entity_id:
              - "automation.topeni_fail_safe_nedostatecny_prutok_kotlem"
              - "automation.topeni_ochrana_pri_nedostatecnem_prutoku_kotlem"
              - "automation.topeni_flow_relief_timeout_guard"
              - "automation.topeni_flow_relief_blokuje_rele_a_hlavni_rizeni"
              - "automation.topeni_flow_relief_obnova_po_poruse"
              - "automation.topeni_flow_relief_fault_recovery_reconciler_v2"
              - "automation.kotel_zapnout_pri_splneni_politiky"
          data:
            stop_actions: true
          continue_on_error: true
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "RESTORING"
          then:
            -
              action: "input_select.select_option"
              target:
                entity_id: "input_select.heating_flow_state_v4"
              data:
                option: "EMERGENCY_COOLING"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "NORMAL"
            -
              condition: "state"
              entity_id: "input_boolean.heating_service_mode"
              state: "off"
            -
              condition: "or"
              conditions:
                -
                  condition: "state"
                  entity_id: "sensor.boiler_servicecodenumber"
                  state:
                    - "2964"
                    - "2965"
                    - "2966"
                    - "2967"
                -
                  condition: "numeric_state"
                  entity_id: "sensor.boiler_heatblock"
                  above: 72
          then:
            -
              event: "heating_flow_v4_force_emergency"
              event_data:
                source: "startup_reconcile"
        -
          if:
            -
              condition: "state"
              entity_id: "input_select.heating_flow_state_v4"
              state: "EMERGENCY_COOLING"
          then:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.topny_system_enable"
              continue_on_error: true
            -
              action: "switch.turn_off"
              target:
                entity_id: "switch.kotel_rele_spinac"
              continue_on_error: true
            -
              action: "climate.set_hvac_mode"
              target:
                entity_id:
                  - "climate.1p_jidelna"
                  - "climate.sklep_michal"
                  - "climate.2p_mama"
                  - "climate.prizemi_michal"
              data:
                hvac_mode: "heat"
              continue_on_error: true
            -
              action: "climate.set_temperature"
              target:
                entity_id:
                  - "climate.1p_jidelna"
                  - "climate.sklep_michal"
                  - "climate.2p_mama"
                  - "climate.prizemi_michal"
              data:
                temperature: 29
              continue_on_error: true
            -
              delay:
                seconds: 2
            -
              action: "climate.set_hvac_mode"
              target:
                entity_id:
                  - "climate.prizemi_chodba_zachod"
                  - "climate.1p_kuchyn"
                  - "climate.1p_koupelna"
                  - "climate.1p_chodba"
              data:
                hvac_mode: "heat"
              continue_on_error: true
            -
              action: "climate.set_temperature"
              target:
                entity_id:
                  - "climate.prizemi_chodba_zachod"
                  - "climate.1p_kuchyn"
                  - "climate.1p_koupelna"
                  - "climate.1p_chodba"
              data:
                temperature: 29
              continue_on_error: true
    -
      if:
        -
          condition: "trigger"
          id: "paths_confirmed"
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "EMERGENCY_COOLING"
      then:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_flow_paths_verified_v4"
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "input_boolean.heating_flow_paths_verified_v4"
            message: "Potvrzeny alespoň dvě nouzové průtokové cesty."
    -
      if:
        -
          condition: "trigger"
          id:
            - "r2_20s"
            - "heatblock_72"
            - "fault_2964"
            - "fault_2965"
            - "fault_2966"
            - "fault_2967"
            - "force_emergency"
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state:
            - "NORMAL"
            - "RESTORING"
        -
          condition: "state"
          entity_id: "input_boolean.heating_service_mode"
          state: "off"
      then:
        -
          variables:
            now_ts: "{{ as_timestamp(now()) | int }}"
            baselines: "{{ [states('sensor.sklep_michal_pocet_kroku_motoru')|int, states('sensor.prizemi_michal_pocet_kroku_motoru')|int, states('sensor.prizemi_chodba_zachod_pocet_kroku_motoru')|int, states('sensor.1p_jidelna_pocet_kroku_motoru')|int, states('sensor.1p_kuchyn_pocet_kroku_motoru')|int, states('sensor.1p_koupelna_pocet_kroku_motoru')|int, states('sensor.1p_chodba_pocet_kroku_motoru')|int, states('sensor.2p_mama_pocet_kroku_motoru')|int] }}"
        -
          action: "input_select.select_option"
          target:
            entity_id: "input_select.heating_flow_state_v4"
          data:
            option: "EMERGENCY_COOLING"
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_flow_relief_mode"
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_flow_relief_lockout"
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_restore_verified"
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_flow_paths_verified_v4"
        -
          action: "input_datetime.set_datetime"
          target:
            entity_id: "input_datetime.heating_flow_relief_started_at"
          data:
            timestamp: "{{ now_ts }}"
        -
          if:
            -
              condition: "trigger"
              id:
                - "fault_2964"
                - "fault_2965"
                - "fault_2966"
                - "fault_2967"
          then:
            -
              action: "input_datetime.set_datetime"
              target:
                entity_id: "input_datetime.heating_flow_relief_last_fault"
              data:
                timestamp: "{{ now_ts }}"
        -
          action: "input_text.set_value"
          target:
            entity_id: "input_text.heating_flow_relief_state_v1"
          data:
            value: "v3:{{ [now_ts|int, 1, baselines] | to_json }}"
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.topny_system_enable"
          continue_on_error: true
        -
          action: "switch.turn_off"
          target:
            entity_id: "switch.kotel_rele_spinac"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.boost_now"
          continue_on_error: true
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "sensor.boiler_heatblock"
            message: "EMERGENCY_COOLING: kotel OFF, otevírám TRV ve dvou dávkách. Trigger={{ trigger.id }}; heatblock={{ states('sensor.boiler_heatblock') }} °C; TUV valve={{ states('binary_sensor.boiler_ww3wayvalve') }}."
        -
          action: "climate.set_hvac_mode"
          target:
            entity_id:
              - "climate.1p_jidelna"
              - "climate.sklep_michal"
              - "climate.2p_mama"
              - "climate.prizemi_michal"
          data:
            hvac_mode: "heat"
          continue_on_error: true
        -
          action: "climate.set_temperature"
          target:
            entity_id:
              - "climate.1p_jidelna"
              - "climate.sklep_michal"
              - "climate.2p_mama"
              - "climate.prizemi_michal"
          data:
            temperature: 29
          continue_on_error: true
        -
          delay:
            seconds: 2
        -
          action: "climate.set_hvac_mode"
          target:
            entity_id:
              - "climate.prizemi_chodba_zachod"
              - "climate.1p_kuchyn"
              - "climate.1p_koupelna"
              - "climate.1p_chodba"
          data:
            hvac_mode: "heat"
          continue_on_error: true
        -
          action: "climate.set_temperature"
          target:
            entity_id:
              - "climate.prizemi_chodba_zachod"
              - "climate.1p_kuchyn"
              - "climate.1p_koupelna"
              - "climate.1p_chodba"
          data:
            temperature: 29
          continue_on_error: true
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_flow_v4_active"
            title: "Topení – nouzové chlazení"
            message: "Kotel je bezpečně vypnutý. Hlavice jsou dočasně otevřené pro odvod tepla. Po poklesu bloku pod 60 °C V4 automaticky vrátí všechny zóny do normálního režimu."
        -
          stop: "Nouzové chlazení spuštěno."
    -
      if:
        -
          condition: "trigger"
          id: "service_attempt"
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state:
            - "EMERGENCY_COOLING"
            - "RESTORING"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_service_mode"
          continue_on_error: true
        -
          action: "logbook.log"
          data:
            name: "Topení – Flow V4"
            entity_id: "input_boolean.heating_service_mode"
            message: "Servisní režim byl během emergency/recovery odmítnut, aby nepřepsal state-machine."
        -
          stop: "Servisní režim je během emergency/recovery blokovaný."
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "EMERGENCY_COOLING"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.topny_system_enable"
          continue_on_error: true
        -
          action: "switch.turn_off"
          target:
            entity_id: "switch.kotel_rele_spinac"
          continue_on_error: true
        -
          variables:
            started_ts: "{{ state_attr('input_datetime.heating_flow_relief_started_at','timestamp') | float(0) }}"
            elapsed: "{{ (as_timestamp(now()) - (state_attr('input_datetime.heating_flow_relief_started_at','timestamp') | float(0))) | int(0) }}"
        -
          if:
            -
              condition: "template"
              value_template: "{{ elapsed >= 120 }}"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_paths_verified_v4"
              state: "off"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_lockout"
              state: "off"
          then:
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_lockout"
            -
              action: "persistent_notification.create"
              data:
                notification_id: "heating_flow_v4_paths_failed"
                title: "Topení – průtokové cesty nepotvrzeny"
                message: "Do 120 s nebyly potvrzeny alespoň dvě otevřené TRV. Kotel zůstane po ochlazení v HARD_LOCKOUT, ale hlavice se přesto vrátí na normální cíle."
        -
          if:
            -
              condition: "numeric_state"
              entity_id: "sensor.boiler_heatblock"
              below: 60
            -
              condition: "state"
              entity_id: "binary_sensor.boiler_burngas"
              state: "off"
            -
              condition: "or"
              conditions:
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_paths_verified_v4"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_relief_lockout"
                  state: "on"
          then:
            -
              action: "logbook.log"
              data:
                name: "Topení – Flow V4"
                entity_id: "sensor.boiler_heatblock"
                message: "Kotel vychladl pod 60 °C. Přechod EMERGENCY_COOLING → RESTORING."
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_mode"
            -
              action: "input_select.select_option"
              target:
                entity_id: "input_select.heating_flow_state_v4"
              data:
                option: "RESTORING"
            -
              event: "heating_flow_v4_reconcile"
              event_data:
                source: "cooled_to_restoring"
            -
              stop: "Přechod do RESTORING."
          else:
            -
              stop: "Emergency cooling pokračuje."
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "RESTORING"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.topny_system_enable"
          continue_on_error: true
        -
          action: "switch.turn_off"
          target:
            entity_id: "switch.kotel_rele_spinac"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_service_mode"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_restore_verified"
        -
          action: "script.heating_restore_schedule_after_service"
          continue_on_error: true
        -
          if:
            -
              condition: "not"
              conditions:
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_restore_verified"
                  state: "on"
          then:
            -
              wait_for_trigger:
                -
                  trigger: "state"
                  entity_id: "input_boolean.heating_restore_verified"
                  to: "on"
              timeout: "00:03:00"
              continue_on_timeout: true
        -
          choose:
            -
              conditions:
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_restore_verified"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_relief_lockout"
                  state: "off"
                -
                  condition: "state"
                  entity_id: "input_boolean.heating_flow_paths_verified_v4"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "binary_sensor.heating_boiler_fault_clear"
                  state: "on"
                -
                  condition: "state"
                  entity_id: "sensor.system_bus_status"
                  state: "connected"
                -
                  condition: "state"
                  entity_id: "binary_sensor.boiler_burngas"
                  state: "off"
                -
                  condition: "numeric_state"
                  entity_id: "sensor.boiler_heatblock"
                  below: 60
              sequence:
                -
                  action: "input_boolean.turn_off"
                  target:
                    entity_id: "input_boolean.heating_fault_recovery_pending"
                -
                  choose:
                    -
                      conditions:
                        -
                          condition: "state"
                          entity_id: "input_boolean.heating_flow_relief_resume_armed"
                          state: "on"
                      sequence:
                        -
                          action: "input_boolean.turn_on"
                          target:
                            entity_id: "input_boolean.topny_system_enable"
                  default:
                    -
                      action: "input_boolean.turn_off"
                      target:
                        entity_id: "input_boolean.topny_system_enable"
                -
                  action: "persistent_notification.dismiss"
                  data:
                    notification_id: "heating_flow_v4_active"
                -
                  action: "persistent_notification.create"
                  data:
                    notification_id: "heating_flow_v4_recovered"
                    title: "Topení – recovery dokončena"
                    message: "Kotel vychladl, všech 8 zón potvrdilo normální cíle a bezpečnostní podmínky jsou splněné. Původní povolení topení bylo obnoveno."
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – Flow V4"
                    entity_id: "input_boolean.heating_restore_verified"
                    message: "RESTORING dokončen: cíle zón ověřeny, fault-clear OK, EMS OK, cesty potvrzeny. Návrat do NORMAL."
                -
                  action: "input_select.select_option"
                  target:
                    entity_id: "input_select.heating_flow_state_v4"
                  data:
                    option: "NORMAL"
                -
                  action: "input_boolean.turn_off"
                  target:
                    entity_id: "input_boolean.heating_flow_paths_verified_v4"
          default:
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_fault_recovery_pending"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_flow_relief_lockout"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.topny_system_enable"
              continue_on_error: true
            -
              action: "switch.turn_off"
              target:
                entity_id: "switch.kotel_rele_spinac"
              continue_on_error: true
            -
              action: "persistent_notification.dismiss"
              data:
                notification_id: "heating_flow_v4_active"
            -
              action: "persistent_notification.create"
              data:
                notification_id: "heating_flow_v4_hard_lockout"
                title: "Topení – HARD LOCKOUT"
                message: "Hlavice byly vráceny na normální cíle, ale některá bezpečnostní podmínka pro restart kotle neprošla (cesty / fault-clear / EMS / restore). Kotel zůstává OFF."
            -
              action: "logbook.log"
              data:
                name: "Topení – Flow V4"
                entity_id: "input_boolean.heating_flow_relief_lockout"
                message: "RESTORING skončil HARD_LOCKOUT. Zóny jsou normalizované, kotel zůstává OFF."
            -
              action: "input_select.select_option"
              target:
                entity_id: "input_select.heating_flow_state_v4"
              data:
                option: "HARD_LOCKOUT"
    -
      if:
        -
          condition: "state"
          entity_id: "input_select.heating_flow_state_v4"
          state: "HARD_LOCKOUT"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.topny_system_enable"
          continue_on_error: true
        -
          action: "switch.turn_off"
          target:
            entity_id: "switch.kotel_rele_spinac"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
          continue_on_error: true
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_flow_relief_mode"
          continue_on_error: true
  initial_state: true
-
  id: "1790189679088"
  alias: "Topení – flow relief obnova po poruše"
  description: "Fault classifier V3 pro 2964–2967: každá porucha bezpečně vypne kotel, otevře průtokové cesty a nastaví persistentní recovery. Po vychladnutí bloku pod 60 °C a ověření fault-clear/EMS/průtoku se automaticky obnoví normální cíle hlavic a původní povolení topení; opakovaná porucha zahájí nový recovery cyklus místo časového lockoutu."
  mode: "queued"
  max: 10
  max_exceeded: "silent"
  trigger:
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2964"
      id: "2964"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2965"
      id: "2965"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2966"
      id: "2966"
    -
      trigger: "state"
      entity_id: "sensor.boiler_servicecodenumber"
      to: "2967"
      id: "2967"
  condition:
    []
  action:
    -
      variables:
        now_ts: "{{ as_timestamp(now()) | int }}"
        prev_fault_ts: "{{ as_timestamp(states('input_datetime.heating_flow_relief_last_fault'),0) | int }}"
        fault_age: "{{ (as_timestamp(now()) - as_timestamp(states('input_datetime.heating_flow_relief_last_fault'),0)) | int }}"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.boost_now"
      continue_on_error: true
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_restore_verified"
    -
      action: "input_boolean.turn_on"
      target:
        entity_id: "input_boolean.heating_service_mode"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.heating_flow_relief_mode"
    -
      choose:
        -
          conditions:
            -
              condition: "template"
              value_template: "{{ prev_fault_ts > 0 and fault_age >= 0 and fault_age < 600 }}"
          sequence:
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "sensor.boiler_servicecodenumber"
                message: "Kód {{ trigger.id }} patří do již otevřeného poruchového clusteru; last_fault se neposouvá."
            -
              stop: "Stejný poruchový cluster."
        -
          conditions:
            -
              condition: "template"
              value_template: "{{ prev_fault_ts > 0 and fault_age >= 600 and fault_age < 21600 }}"
          sequence:
            -
              action: "input_datetime.set_datetime"
              target:
                entity_id: "input_datetime.heating_flow_relief_last_fault"
              data:
                timestamp: "{{ now_ts }}"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.heating_flow_relief_lockout"
            -
              action: "input_boolean.turn_on"
              target:
                entity_id: "input_boolean.heating_fault_recovery_pending"
            -
              action: "logbook.log"
              data:
                name: "Topení – flow relief"
                entity_id: "input_boolean.heating_fault_recovery_pending"
                message: "Opakovaná porucha {{ trigger.id }} zahájila nový recovery cyklus. Kotel zůstává OFF; po vychladnutí pod 60 °C a ověření bezpečných podmínek se obnoví normální režim."
            -
              stop: "Opakovaná porucha byla předána novému recovery cyklu."
    -
      action: "input_datetime.set_datetime"
      target:
        entity_id: "input_datetime.heating_flow_relief_last_fault"
      data:
        timestamp: "{{ now_ts }}"
    -
      action: "logbook.log"
      data:
        name: "Topení – flow relief"
        entity_id: "sensor.boiler_servicecodenumber"
        message: "Nový poruchový cluster {{ trigger.id }}. Kotel je bezpečně OFF; recovery obnoví normální režim po vychladnutí bloku pod 60 °C a ověření bezpečných podmínek."
    -
      if:
        -
          condition: "or"
          conditions:
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_enabled"
              state: "off"
            -
              condition: "state"
              entity_id: "input_boolean.heating_flow_relief_resume_armed"
              state: "off"
      then:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_flow_relief_no_auto_resume"
            title: "Topení – porucha zachycena, bez automatické obnovy"
            message: "Flow relief není povolený nebo před poruchou nebylo uložené povolení topení. Servisní fail-safe zůstává aktivní a AUTO se samo neobnoví."
      else:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_fault_recovery_pending"
        -
          action: "logbook.log"
          data:
            name: "Topení – flow relief"
            entity_id: "input_boolean.heating_fault_recovery_pending"
            message: "Fault recovery je armed; po vychladnutí pod 60 °C a splnění bezpečnostních podmínek reconciler obnoví cíle zón a původní povolení topení."
  initial_state: false
-
  id: "1790498888958"
  alias: "Topení Watchdog – ruční zásah mimo rozvrh → MANUAL"
  description: "Regresní watchdog pro všech 8 chytrých zón. Fyzická/UI změna cílové teploty nad ECO mimo aktivní rozvrhové okno musí aktivovat zónový MANUAL override. Watchdog pouze diagnostikuje: po krátké toleranci vytvoří persistentní upozornění a log, pokud MANUAL nevznikl. Při aktivaci MANUAL nebo vstupu zóny do rozvrhu upozornění uklidí."
  mode: "parallel"
  max: 16
  initial_state: true
  trigger:
    -
      trigger: "state"
      entity_id:
        - "climate.sklep_michal"
        - "climate.prizemi_michal"
        - "climate.prizemi_chodba_zachod"
        - "climate.1p_jidelna"
        - "climate.1p_kuchyn"
        - "climate.1p_koupelna"
        - "climate.1p_chodba"
        - "climate.2p_mama"
      attribute: "temperature"
      for: "00:00:02"
      id: "climate_change"
    -
      trigger: "state"
      entity_id:
        - "input_boolean.sklep_michal_manual_override"
        - "input_boolean.prizemi_michal_manual_override"
        - "input_boolean.prizemi_chodba_zachod_manual_override"
        - "input_boolean.1p_jidelna_manual_override"
        - "input_boolean.1p_kuchyn_manual_override"
        - "input_boolean.1p_koupelna_manual_override"
        - "input_boolean.1p_chodba_manual_override"
        - "input_boolean.2p_mama_manual_override"
      from: "off"
      to: "on"
      id: "manual_on"
    -
      trigger: "state"
      entity_id:
        - "input_boolean.sklep_michal_schedule_active"
        - "input_boolean.prizemi_michal_schedule_active"
        - "input_boolean.prizemi_chodba_zachod_schedule_active"
        - "input_boolean.1p_jidelna_schedule_active"
        - "input_boolean.1p_kuchyn_schedule_active"
        - "input_boolean.1p_koupelna_schedule_active"
        - "input_boolean.1p_chodba_schedule_active"
        - "input_boolean.2p_mama_schedule_active"
      to: "on"
      id: "schedule_on"
  action:
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "manual_on"
          sequence:
            -
              variables:
                zone: "{{ trigger.entity_id | replace('input_boolean.', '') | replace('_manual_override', '') }}"
            -
              action: "persistent_notification.dismiss"
              continue_on_error: true
              data:
                notification_id: "{{ 'heating_manual_watchdog_' ~ zone }}"
        -
          conditions:
            -
              condition: "trigger"
              id: "schedule_on"
          sequence:
            -
              variables:
                zone: "{{ trigger.entity_id | replace('input_boolean.', '') | replace('_schedule_active', '') }}"
            -
              action: "persistent_notification.dismiss"
              continue_on_error: true
              data:
                notification_id: "{{ 'heating_manual_watchdog_' ~ zone }}"
        -
          conditions:
            -
              condition: "trigger"
              id: "climate_change"
          sequence:
            -
              variables:
                zone: "{{ trigger.entity_id.split('.')[1] }}"
                climate_entity: "{{ trigger.entity_id }}"
                manual_entity: "{{ 'input_boolean.' ~ trigger.entity_id.split('.')[1] ~ '_manual_override' }}"
                schedule_entity: "{{ 'input_boolean.' ~ trigger.entity_id.split('.')[1] ~ '_schedule_active' }}"
                schedule_enable_entity: "{{ 'input_boolean.schedule_enable_' ~ trigger.entity_id.split('.')[1] }}"
                new_set: "{{ trigger.to_state.attributes.temperature | float(default=none) }}"
                eco: "{{ states('input_number.eco_temp_default') | float(15) }}"
                is_user_action: "{{ trigger.to_state is not none and trigger.to_state.context is defined and (trigger.to_state.context.user_id is not none or trigger.to_state.context.parent_id is none) }}"
                outside_window: "{{ schedule_entity not in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or []) }}"
            -
              condition: "state"
