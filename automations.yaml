-
  id: "1789741778892"
  alias: "Topení – kontrola adaptace chodby 2026-09-18"
  description: "Jednorázová kontrola adaptace zahájené 18. 9. 2026 v 16:28. Oznámí výsledek při ukončení nebo v 19:45. Nemění nastavení hlavic ani kotle; po oznámení se vypne."
  mode: "single"
  trigger:
    -
      trigger: "state"
      entity_id: "sensor.1p_chodba_stav_adaptacniho_behu"
      attribute: "Valve_characteristic_found"
      to: true
      id: "found"
    -
      trigger: "state"
      entity_id: "sensor.1p_chodba_stav_adaptacniho_behu"
      attribute: "In_progress"
      from: true
      to: false
      for:
        seconds: 30
      id: "ended"
    -
      trigger: "time"
      at: "19:45:00"
      id: "deadline"
  action:
    -
      choose:
        -
          conditions:
            -
              condition: "state"
              entity_id: "sensor.1p_chodba_stav_adaptacniho_behu"
              attribute: "Valve_characteristic_found"
              state: true
          sequence:
            -
              action: "persistent_notification.create"
              data:
                title: "Topení – adaptace chodby"
                message: "Adaptace hlavice na chodbě v 1. patře je úspěšná. Hlavice potvrdila naučenou charakteristiku ventilu."
                notification_id: "heating_chodba_adaptation_20260918"
        -
          conditions:
            -
              condition: "state"
              entity_id: "sensor.1p_chodba_stav_adaptacniho_behu"
              attribute: "In_progress"
              state: true
          sequence:
            -
              action: "persistent_notification.create"
              data:
                title: "Topení – adaptace chodby"
                message: "Adaptace hlavice na chodbě stále probíhá. Do kontrolního času 19:45 nebyl úspěch potvrzen. Stav je vidět v Diagnostice hlavic; opravu zatím nelze považovat za dokončenou."
                notification_id: "heating_chodba_adaptation_20260918"
      default:
        -
          action: "persistent_notification.create"
          data:
            title: "Topení – adaptace chodby"
            message: "Úspěšná adaptace hlavice na chodbě nebyla potvrzena. Zkontroluj Diagnostiku hlavic: dostupnost, přívod tepla a případné přerušení změnou požadované teploty. Naučená charakteristika ventilu zatím není potvrzena."
            notification_id: "heating_chodba_adaptation_20260918"
    -
      action: "automation.turn_off"
      target:
        entity_id: "automation.topeni_kontrola_adaptace_chodby_2026_09_18"
      data:
        stop_actions: false
  initial_state: false
-
  id: "heating_service_mode_guard"
  alias: "Topení – servisní režim"
  description: "Ruční servisní režim. Je oddělený od Flow V4; během EMERGENCY_COOLING/RESTORING se nesmí aktivovat ani spustit restore. V NORMAL/HARD_LOCKOUT funguje standardně. 2026-10-09: Service OFF saves resume eligibility before restore script clears the helper and reenables master only after successful restore and EMS safety checks; boiler relay remains controlled by Flow V4 start policy."
  mode: "restart"
  trigger:
    -
      trigger: "state"
      entity_id: "input_boolean.heating_service_mode"
      to: "on"
      id: "service_on"
    -
      trigger: "state"
      entity_id: "input_boolean.heating_service_mode"
      from: "on"
      to: "off"
      id: "service_off"
    -
      trigger: "homeassistant"
      event: "start"
      id: "ha_start"
  condition:
    []
  action:
    -
      choose:
        -
          conditions:
            -
              condition: "trigger"
              id: "service_on"
          sequence:
            -
              if:
                -
                  condition: "state"
                  entity_id: "input_select.heating_flow_state_v4"
                  state:
                    - "EMERGENCY_COOLING"
                    - "RESTORING"
              then:
                -
                  action: "input_boolean.turn_off"
                  target:
                    entity_id: "input_boolean.heating_service_mode"
                  continue_on_error: true
                -
                  action: "logbook.log"
                  data:
                    name: "Topení – servis"
                    entity_id: "input_boolean.heating_service_mode"
                    message: "Servisní režim byl odmítnut: Flow V4 právě chladí nebo obnovuje systém."
                -
                  stop: "Servis je během EMERGENCY_COOLING/RESTORING blokovaný."
            -
              action: "script.turn_off"
              target:
                entity_id: "script.heating_restore_schedule_after_service"
            -
              if:
                -
                  condition: "template"
                  value_template: "{{ trigger.from_state is defined\n   and trigger.from_state is not none\n   and trigger.from_state.state == 'off'\n   and states('input_boolean.topny_system_enable') in ['on', 'off'] }}"
              then:
                -
                  if:
                    -
                      condition: "state"
                      entity_id: "input_boolean.topny_system_enable"
                      state: "on"
                  then:
                    -
                      action: "input_boolean.turn_on"
                      target:
                        entity_id: "input_boolean.heating_service_restore_main_enable"
                  else:
                    -
                      action: "input_boolean.turn_off"
                      target:
                        entity_id: "input_boolean.heating_service_restore_main_enable"
            -
              action: "input_boolean.turn_off"
              target:
                entity_id: "input_boolean.topny_system_enable"
              continue_on_error: true
              alias: "Nejdřív zablokuje hlavní řízení."
            -
              action: "switch.turn_off"
              target:
                entity_id: "switch.kotel_rele_spinac"
              continue_on_error: true
              alias: "Relé se vypíná nezávisle; jeho chyba nesmí zablokovat servisní fail-safe."
            -
              parallel:
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.sklep_michal"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.sklep_michal"
                      data:
                        temperature: 29
                      continue_on_error: true
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.prizemi_michal"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.prizemi_michal"
                      data:
                        temperature: 29
                      continue_on_error: true
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.prizemi_chodba_zachod"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.prizemi_chodba_zachod"
                      data:
                        temperature: 29
                      continue_on_error: true
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.1p_kuchyn"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.1p_kuchyn"
                      data:
                        temperature: 29
                      continue_on_error: true
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.1p_jidelna"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.1p_jidelna"
                      data:
                        temperature: 29
                      continue_on_error: true
                -
                  sequence:
                    -
                      action: "climate.set_hvac_mode"
                      target:
                        entity_id: "climate.1p_chodba"
                      data:
                        hvac_mode: "heat"
                      continue_on_error: true
                    -
                      action: "climate.set_temperature"
                      target:
                        entity_id: "climate.1p_chodba"
                      data:
                        temperature: 29
                      continue_on_error: true
