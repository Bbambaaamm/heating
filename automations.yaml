  id: "1790499115808"
  alias: "Topení Watchdog – integrita MANUAL cíle"
  description: "Self-healing kontrola účinného MANUAL override. Pokud fyzická hlavice nedrží last_comfort (např. dorazí opožděný starý setpoint), cíleně zavolá authoritative apply pouze pro driftující zónu s decision-input fencingem. Pokud ani cílený apply neuspěje, vytvoří persistentní upozornění."
  mode: "queued"
  initial_state: true
  max: 10
  max_exceeded: "warning"
  trigger:
    -
      trigger: "state"
      entity_id:
        - "climate.sklep_michal"
        - "climate.prizemi_michal"
        - "climate.prizemi_chodba_zachod"
        - "climate.1p_jidelna"
        - "climate.1p_kuchyn"
        - "climate.1p_koupelna"
        - "climate.1p_chodba"
        - "climate.2p_mama"
      attribute: "temperature"
      for: "00:00:03"
      id: "climate_target"
    -
      trigger: "state"
      entity_id:
        - "input_boolean.sklep_michal_manual_override"
        - "input_boolean.prizemi_michal_manual_override"
        - "input_boolean.prizemi_chodba_zachod_manual_override"
        - "input_boolean.1p_jidelna_manual_override"
        - "input_boolean.1p_kuchyn_manual_override"
        - "input_boolean.1p_koupelna_manual_override"
        - "input_boolean.1p_chodba_manual_override"
        - "input_boolean.2p_mama_manual_override"
      id: "manual"
    -
      trigger: "state"
      entity_id:
        - "input_number.sklep_michal_last_comfort"
        - "input_number.prizemi_michal_last_comfort"
        - "input_number.prizemi_chodba_zachod_last_comfort"
        - "input_number.1p_jidelna_last_comfort"
        - "input_number.1p_kuchyn_last_comfort"
        - "input_number.1p_koupelna_last_comfort"
        - "input_number.1p_chodba_last_comfort"
        - "input_number.2p_mama_last_comfort"
      id: "comfort"
    -
      trigger: "state"
      entity_id:
        - "timer.sklep_michal_manual_override"
        - "timer.prizemi_michal_manual_override"
        - "timer.prizemi_chodba_zachod_manual_override"
        - "timer.1p_jidelna_manual_override"
        - "timer.1p_kuchyn_manual_override"
        - "timer.1p_koupelna_manual_override"
        - "timer.1p_chodba_manual_override"
        - "timer.2p_mama_manual_override"
      id: "timer"
    -
      trigger: "state"
      entity_id:
        - "input_select.sklep_michal_manual_override_type"
        - "input_select.prizemi_michal_manual_override_type"
        - "input_select.prizemi_chodba_zachod_manual_override_type"
        - "input_select.1p_jidelna_manual_override_type"
        - "input_select.1p_kuchyn_manual_override_type"
        - "input_select.1p_koupelna_manual_override_type"
        - "input_select.1p_chodba_manual_override_type"
        - "input_select.2p_mama_manual_override_type"
      id: "manual_type"
  condition:
    -
      condition: "state"
      entity_id: "input_boolean.topny_system_enable"
      state: "on"
    -
      condition: "state"
      entity_id: "input_boolean.heating_central_dispatch_enable"
      state: "on"
  action:
    -
      delay: "00:00:02"
    -
      variables:
        manual_mismatch_zones: "{% set ns = namespace(v=[]) %}\n{% for z in [\"sklep_michal\",\"prizemi_michal\",\"prizemi_chodba_zachod\",\"1p_jidelna\",\"1p_kuchyn\",\"1p_koupelna\",\"1p_chodba\",\"2p_mama\"] %}\n  {% set manual = is_state('input_boolean.' ~ z ~ '_manual_override', 'on')\n      and (states('input_select.' ~ z ~ '_manual_override_type') == 'Do další změny rozvrhu'\n           or (states('input_select.' ~ z ~ '_manual_override_type') == 'Časovač'\n               and is_state('timer.' ~ z ~ '_manual_override', 'active'))) %}\n  {% set enabled = is_state('input_boolean.schedule_enable_' ~ z, 'on') %}\n  {% set actual = state_attr('climate.' ~ z, 'temperature') | float(default=none) %}\n  {% set target = states('input_number.' ~ z ~ '_last_comfort') | float(default=none) %}\n  {% if manual and enabled and actual is not none and target is not none and ((actual-target)|abs > 0.1) %}\n    {% set ns.v = ns.v + [z] %}\n  {% endif %}\n{% endfor %}\n{{ ns.v }}"
    -
      choose:
        -
          conditions:
            -
              condition: "template"
              value_template: "{{ manual_mismatch_zones | length > 0 }}"
          sequence:
            -
              repeat:
                for_each: "{{ manual_mismatch_zones }}"
                sequence:
                  -
                    variables:
                      z: "{{ repeat.item }}"
                      climate_entity: "{{ 'climate.' ~ repeat.item }}"
                      schedule_helper: "{{ 'input_boolean.' ~ repeat.item ~ '_schedule_active' }}"
                      expected_inputs: "{{ [states('input_select.topny_rezim'), states('binary_sensor.kotel_boost_active'), states('input_number.eco_temp_default'), states('input_number.boost_comfort_offset_c'), states('input_number.' ~ repeat.item ~ '_last_comfort'), states('input_boolean.' ~ repeat.item ~ '_schedule_active'), states('input_boolean.' ~ repeat.item ~ '_manual_override'), states('input_select.' ~ repeat.item ~ '_manual_override_type'), states('timer.' ~ repeat.item ~ '_manual_override'), states('input_boolean.schedule_enable_' ~ repeat.item), ('input_boolean.' ~ repeat.item ~ '_schedule_active') in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] }}"
                      requested_temp: "{{ states('input_number.' ~ repeat.item ~ '_last_comfort') | float(default=none) }}"
                  -
                    condition: "template"
                    value_template: "{{ requested_temp is not none }}"
                  -
                    action: "script.heating_apply_zone_target"
                    continue_on_error: true
                    data:
                      climate_entity: "{{ climate_entity }}"
                      requested_temp: "{{ requested_temp }}"
                      expected_inputs: "{{ expected_inputs }}"
                      reason: "manual_integrity_self_heal"
            -
              variables:
                remaining_mismatch_zones: "{% set ns = namespace(v=[]) %}\n{% for z in [\"sklep_michal\",\"prizemi_michal\",\"prizemi_chodba_zachod\",\"1p_jidelna\",\"1p_kuchyn\",\"1p_koupelna\",\"1p_chodba\",\"2p_mama\"] %}\n  {% set manual = is_state('input_boolean.' ~ z ~ '_manual_override', 'on')\n      and (states('input_select.' ~ z ~ '_manual_override_type') == 'Do další změny rozvrhu'\n           or (states('input_select.' ~ z ~ '_manual_override_type') == 'Časovač'\n               and is_state('timer.' ~ z ~ '_manual_override', 'active'))) %}\n  {% set enabled = is_state('input_boolean.schedule_enable_' ~ z, 'on') %}\n  {% set actual = state_attr('climate.' ~ z, 'temperature') | float(default=none) %}\n  {% set target = states('input_number.' ~ z ~ '_last_comfort') | float(default=none) %}\n  {% if manual and enabled and actual is not none and target is not none and ((actual-target)|abs > 0.1) %}\n    {% set ns.v = ns.v + [z] %}\n  {% endif %}\n{% endfor %}\n{{ ns.v }}"
            -
              choose:
                -
                  conditions:
                    -
                      condition: "template"
                      value_template: "{{ remaining_mismatch_zones | length > 0 }}"
                  sequence:
                    -
                      action: "persistent_notification.create"
                      data:
                        notification_id: "heating_manual_target_integrity"
                        title: "Topení – MANUAL cíl není dodržen"
                        message: "Cílený authoritative apply nedokázal srovnat MANUAL zóny: {{ remaining_mismatch_zones }}. Zkontrolujte hlavici, Zigbee a trace script.heating_apply_zone_target_central."
                    -
                      action: "logbook.log"
                      data:
                        name: "Topení Watchdog – MANUAL integrita"
                        entity_id: "input_boolean.heating_central_dispatch_enable"
                        message: "ALARM: cílený self-heal neopravil MANUAL drift u {{ remaining_mismatch_zones }}."
              default:
                -
                  action: "persistent_notification.dismiss"
                  continue_on_error: true
                  data:
                    notification_id: "heating_manual_target_integrity"
                -
                  action: "logbook.log"
                  data:
                    name: "Topení Watchdog – MANUAL integrita"
                    entity_id: "input_boolean.heating_central_dispatch_enable"
                    message: "Self-heal OK: cílený authoritative apply opravil MANUAL drift pro {{ manual_mismatch_zones }}."
      default:
        -
          action: "persistent_notification.dismiss"
          continue_on_error: true
          data:
            notification_id: "heating_manual_target_integrity"
