        message: "{% set ns = namespace(values={}) %}{% for e in [\"input_boolean.topny_system_enable\",\"input_boolean.heating_service_mode\",\"switch.kotel_rele_spinac\",\"binary_sensor.kotel_should_be_on\",\"binary_sensor.boiler_burngas\",\"binary_sensor.boiler_heatingpump\",\"sensor.boiler_curflowtemp\",\"sensor.boiler_heatblock\",\"sensor.boiler_curburnpow\",\"sensor.boiler_heatingpumpmod\",\"sensor.boiler_servicecodenumber\",\"sensor.boiler_lastcode\",\"sensor.kotel_aktivni_zony_pocet\",\"sensor.kotel_poptavka_prumer\",\"sensor.system_bus_status\"] %}{% set ns.values = dict(ns.values, **{e: states(e)}) %}{% endfor %}{% for z in [\"sklep_michal\",\"prizemi_michal\",\"prizemi_chodba_zachod\",\"1p_jidelna\",\"1p_kuchyn\",\"1p_koupelna\",\"1p_chodba\",\"2p_mama\"] %}{% set e = 'climate.' ~ z %}{% set ns.values = dict(ns.values, **{e: {'state':states(e), 'target':state_attr(e,'temperature'), 'temperature':state_attr(e,'current_temperature'), 'demand':state_attr(e,'pi_heating_demand'), 'action':state_attr(e,'hvac_action')}}) %}{% endfor %}{{ {'time':now().isoformat(), 'values':ns.values} | to_json }} | ALL_BOILER={% set ns = namespace(values={}) %}{% for s in states if s.entity_id.split('.')[1].startswith('boiler_') %}{% set ns.values = dict(ns.values, **{s.entity_id: {'state':s.state, 'updated':s.last_updated.isoformat()}}) %}{% endfor %}{{ ns.values | to_json }}"
  initial_state: false
-
  id: "heating_response_pair_v2"
  alias: "Topení – párování povelů a hlášení"
  description: "Pasivní diagnostika v2. Páruje skalární set_temperature s novou změnou cíle a první změnou PI. Stejný povel do 30 s slučuje; jiný cíl ukončí předchozí párování. Timeout 600 s, přerušení při startu HA/reloadu automatizací. Nepotvrzuje doručení, pohyb ani příčinnost. Zapisuje pouze diagnostické input_text a deník. Parametry nejsou bezpečnostní limity."
  variables:
    r: "{{ trigger.event.data.get('record',{}) if trigger is defined and trigger.id=='record' else {} }}"
    reset: "{{ trigger is defined and trigger.id=='reset' }}"
  mode: "queued"
  max: 100
  max_exceeded: "warning"
  trigger:
    -
      trigger: "event"
      event_type: "heating_response_observed_v2"
      id: "record"
    -
      trigger: "time_pattern"
      seconds: "/15"
      id: "tick"
    -
      trigger: "homeassistant"
      event: "start"
      id: "reset"
    -
      trigger: "event"
      event_type: "automation_reloaded"
      id: "reset"
  condition:
    []
  action:
    -
      variables:
        z: "climate.sklep_michal"
        p: "{{ states('input_text.heating_pair_sklep_michal')[3:]|from_json({}) }}"
        t: "{{ as_timestamp(now()) }}"
    -
      variables:
        result: "{# Pure diagnostic reducer; p=previous helper JSON, r=observed record, z=climate id, t=processing time. #}\n{% set ns=namespace(p=p if p is mapping else {}, events=[]) %}\n{% if reset %}\n  {% if ns.p %}{% set ns.events=ns.events+[dict(kind='pair_interrupted',reason='diagnostic_restart',pending=ns.p)] %}{% endif %}\n  {% set ns.p={} %}\n{% else %}\n  {% if ns.p and t-ns.p.get('t',0)>600 %}\n    {% if ns.p.get('a') is none or ns.p.get('p') is none %}\n      {% set ns.events=ns.events+[dict(kind='pair_timeout',reason='no_complete_report_within_600s',pending=ns.p)] %}\n    {% endif %}\n    {% set ns.p={} %}\n  {% endif %}\n  {% if r.get('kind')=='command' and z in r.get('targets',[]) and r.get('service')=='set_temperature' %}\n    {% set v=r.get('requested',{}).get('temperature') %}\n    {% set rt=r.get('event_at',t)|float %}\n    {% if not is_number(v) %}\n      {% set ns.events=ns.events+[dict(kind='pair_unsupported',reason='no_scalar_temperature',event_at=rt)] %}\n    {% elif rt>t+5 or t-rt>30 or (ns.p and rt<ns.p.get('l',0)) %}\n      {% set ns.events=ns.events+[dict(kind='pair_out_of_order',event_at=rt)] %}\n    {% elif ns.p and (ns.p.v|float-v|float)|abs<0.05 and rt-ns.p.l<=30 %}\n      {% set ns.p=dict(ns.p,l=rt|round(3),n=ns.p.n+1) %}\n      {% set ns.events=ns.events+[dict(kind='pair_duplicate',pending=ns.p)] %}\n    {% else %}\n      {% if ns.p and (ns.p.get('a') is none or ns.p.get('p') is none) %}\n        {% set ns.events=ns.events+[dict(kind='pair_superseded',pending=ns.p)] %}\n      {% endif %}\n      {% set zone=r.get('zones',{}).get(z,{}) %}\n      {% set ns.p=dict(t=rt|round(3),l=rt|round(3),v=v|float,b=zone.get('demand'),a=none,p=none,n=1,c=r.get('context_id','')) %}\n      {% set ns.events=ns.events+[dict(kind='pair_started',pending=ns.p,target_already_reported=zone.get('target')==v)] %}\n    {% endif %}\n  {% elif r.get('kind')=='reported_state' and r.get('entity')==z and ns.p %}\n    {% set rt=r.get('event_at',t)|float %}\n    {% 