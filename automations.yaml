    -
      action: "persistent_notification.create"
      data:
        notification_id: "heating_flow_relief_recovered"
        title: "Topení – automatická obnova dokončena"
        message: "Po poruše byly splněny všechny V2 podmínky a ověřeny cíle všech 8 hlavic. AUTO je znovu povolené."
