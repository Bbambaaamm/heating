                title: "Servisní režim topení je aktivní"
                message: "Kotlové relé je blokované, hlavní řízení je pozastavené a všech 8 hlavic má cíl 29 °C. Počkej několik minut na mechanické otevření ventilů. Režim ukonči stejným přepínačem."
        -
