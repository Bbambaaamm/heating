                          continue_on_error: true
                        -
                          action: "climate.set_temperature"
                          target:
                            entity_id: "climate.prizemi_michal"
                          data:
                            temperature: 29
                          continue_on_error: true
                    -
                      sequence:
                        -
                          action: "climate.set_hvac_mode"
                          target:
                            entity_id: "climate.prizemi_chodba_zachod"
                          data:
