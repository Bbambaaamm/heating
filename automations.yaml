          condition: "state"
          entity_id: "binary_sensor.boiler_wwcharging"
          state: "on"
        -
          condition: "state"
          entity_id: "binary_sensor.boiler_tapwateractive"
          state: "on"
    -
      condition: "state"
      entity_id: "switch.kotel_rele_spinac"
      state: "on"
  action:
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
    -
      action: "logbook.log"
