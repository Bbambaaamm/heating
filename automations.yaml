-
  id: "heating_watchdog_clean_notification"
  alias: "Heating Watchdog – čistá notifikace hlavic"
  description: "Uživatelsky čitelná notifikace při problému s hlavicemi. Nahrazuje technický výpis interního diagnostického slovníku; používá stejný notification_id, aby existovala jen jedna hláška a stávající clear automatizace ji mohla odstranit."
  mode: "single"
  trigger:
    -
      trigger: "numeric_state"
      entity_id: "sensor.heating_valves_unhealthy_count"
      above: 0
      for:
        seconds: 30
      id: "problem"
    -
      trigger: "time_pattern"
      minutes: "/10"
      id: "refresh"
  condition:
    -
      condition: "numeric_state"
      entity_id: "sensor.heating_valves_unhealthy_count"
      above: 0
  action:
    -
      action: "persistent_notification.create"
      data:
        notification_id: "heating_watchdog_connectivity_unhealthy"
        title: "Topení – problém s hlavicí"
        message: "{% set count = states('sensor.heating_valves_unhealthy_count') | int(0) %}\n{% set bad = state_attr('sensor.heating_valves_unhealthy_count', 'unhealthy_entities') or [] %}\n⚠️ Heating Watchdog zjistil {{ count }} problematických hlavic.\n{% if bad | count > 0 %}\nDotčené: {% for e in bad %}{{ entity_name(e) }}{% if not loop.last %}, {% endif %}{% endfor %}\n{% endif %}\nKontrola: dostupnost komunikace a poslední aktualizace hlavice (limit 180 min).\nPo obnovení komunikace se upozornění automaticky smaže."
  initial_state: true
