# Standalone public-source candidate; never bulk-import automations.yaml.
id: heating_v4_relay_lockout_guard
alias: Topení V4 – nezávislá blokace relé při lockoutu
description: Nezávislá ochrana pouze vypíná kotlové relé při cizím zapnutí během EMERGENCY_COOLING, RESTORING, HARD_LOCKOUT nebo při aktivním lockoutu. Nedostupný či neplatný bezpečnostní helper rovněž blokuje relé. Za běhu odvolá požadavek bez prodlevy při teplotě bloku >=72 °C nebo chybějící či neplatné teplotě. Mez odpovídá podmínce bezpečného startu. Nezasahuje do masteru, cílů hlavic ani běžící V4 recovery. Při ztrátě potvrzeného počtu/průměru žádajících zón vypne pouze relé bez prodlevy. Chybějící/neplatné policy vstupy blokují. Minimum 2 zóny; potřeba tepla není důkaz průtoku.
initial_state: true
mode: parallel
max: 10
max_exceeded: warning
trigger:
- trigger: state
  entity_id: switch.kotel_rele_spinac
  to: 'on'
  id: relay_on
- trigger: state
  entity_id:
  - input_select.heating_flow_state_v4
  - input_boolean.heating_flow_relief_lockout
  - sensor.boiler_heatblock
  to: null
  id: safety_state_changed
- trigger: homeassistant
  event: start
  id: startup
- trigger: event
  event_type: automation_reloaded
  id: reload
- trigger: state
  entity_id:
  - input_number.kotel_min_zone_demand_pct
  - sensor.kotel_effective_min_active_zones
  - sensor.kotel_effective_min_avg_demand_pct
  - binary_sensor.sklep_michal_potrebne_teplo
  - binary_sensor.prizemi_michal_potrebne_teplo
  - binary_sensor.prizemi_chodba_zachod_potrebne_teplo
  - binary_sensor.1p_jidelna_potrebne_teplo
  - binary_sensor.1p_kuchyn_potrebne_teplo
  - binary_sensor.1p_koupelna_potrebne_teplo
  - binary_sensor.1p_chodba_potrebne_teplo
  - binary_sensor.2p_mama_potrebne_teplo
  - binary_sensor.zona_sklep_michal_aktivni
  - binary_sensor.zona_prizemi_michal_aktivni
  - binary_sensor.zona_prizemi_chodba_zachod_aktivni
  - binary_sensor.zona_1p_jidelna_aktivni
  - binary_sensor.zona_1p_kuchyn_aktivni
  - binary_sensor.zona_1p_koupelna_aktivni
  - binary_sensor.zona_1p_chodba_aktivni
  - binary_sensor.zona_2p_mama_aktivni
  - sensor.zona_sklep_michal_demand
  - sensor.zona_prizemi_michal_demand
  - sensor.zona_prizemi_chodba_zachod_demand
  - sensor.zona_1p_jidelna_demand
  - sensor.zona_1p_kuchyn_demand
  - sensor.zona_1p_koupelna_demand
  - sensor.zona_1p_chodba_demand
  - sensor.zona_2p_mama_demand
  - climate.sklep_michal
  - climate.prizemi_michal
  - climate.prizemi_chodba_zachod
  - climate.1p_jidelna
  - climate.1p_kuchyn
  - climate.1p_koupelna
  - climate.1p_chodba
  - climate.2p_mama
  to: null
  id: confirmed_zone_inputs
- trigger: state
  entity_id: group.topne_zony
  to: null
  id: zone_group_state
- trigger: state
  entity_id: group.topne_zony
  attribute: entity_id
  to: null
  id: zone_group_members
condition:
- condition: state
  entity_id: switch.kotel_rele_spinac
  state: 'on'
- condition: template
  value_template: '{% set block = states(''sensor.boiler_heatblock'') %} {{ not is_state(''input_select.heating_flow_state_v4'', ''NORMAL'') or not is_state(''input_boolean.heating_flow_relief_lockout'', ''off'') or not is_number(block) or block | float(72) >= 72 or not confirmed_zone_policy_ok }}'
action:
- action: switch.turn_off
  target:
    entity_id: switch.kotel_rele_spinac
variables:
  confirmed_zone_policy_ok: "{% set members = state_attr('group.topne_zony', 'entity_id') %}\n{% set supported = ['climate.sklep_michal', 'climate.prizemi_michal', 'climate.prizemi_chodba_zachod', 'climate.1p_jidelna', 'climate.1p_kuchyn', 'climate.1p_koupelna', 'climate.1p_chodba', 'climate.2p_mama'] %}\n{% set min_d = states('input_number.kotel_min_zone_demand_pct') %}\n{% set min_z = states('sensor.kotel_effective_min_active_zones') %}\n{% set min_a = states('sensor.kotel_effective_min_avg_demand_pct') %}\n{% set ns = namespace(valid=has_value('group.topne_zony') and members is iterable and members is not string and members | count > 0 and is_number(min_d) and 0 <= min_d | float(-1) <= 100 and is_number(min_z) and min_z | float(-1) >= 0 and min_z | float(-1) == min_z | int(-2) and is_number(min_a) and min_a | float(-1) >= 0, demands=[]) %}\n{% if members is iterable and members is not string %}\n{% for member in members %}\n  {% if member not in supported %}\n    {% set ns.valid = false\
    \ %}\n  {% endif %}\n{% endfor %}\n{% endif %}\n{% for c in expand('group.topne_zony') %}\n  {% set id = c.entity_id.split('.')[1] %}\n  {% set demand = states('sensor.zona_' ~ id ~ '_demand') %}\n  {% if c.entity_id in supported and c.state == 'heat'\n        and is_state('binary_sensor.zona_' ~ id ~ '_aktivni', 'on')\n        and is_state('binary_sensor.' ~ id ~ '_potrebne_teplo', 'on')\n        and is_number(demand) and 1 < demand | float(0) <= 100\n        and demand | float(0) >= min_d | float(101) %}\n    {% set ns.demands = ns.demands + [demand | float(0)] %}\n  {% endif %}\n{% endfor %}\n{{ ns.valid and ns.demands | count >= [min_z | int(99), 2] | max\n   and ns.demands | count > 0\n   and ns.demands | average(0) >= [min_a | float(999), 15] | max }}"
