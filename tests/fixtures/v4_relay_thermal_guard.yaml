# Standalone candidate for isolated HA Core tests; this fixture does not deploy
# an automation. NORMAL, explicit lockout OFF and finite block temperature <72
# are required to allow relay ON. Missing/invalid inputs fail closed, relay OFF only.
id: heating_v4_relay_lockout_guard
alias: "Topení V4 – nezávislá blokace relé při lockoutu"
description: >-
  Nezávislá ochrana pouze vypíná kotlové relé při cizím zapnutí během
  EMERGENCY_COOLING, RESTORING, HARD_LOCKOUT nebo při aktivním lockoutu.
  Nedostupný či neplatný bezpečnostní helper rovněž blokuje relé.
  Za běhu odvolá požadavek bez prodlevy při teplotě bloku >=72 °C nebo
  chybějící či neplatné teplotě. Mez odpovídá podmínce bezpečného startu.
  Nezasahuje do masteru, cílů hlavic ani běžící V4 recovery.
initial_state: true
mode: parallel
max: 10
max_exceeded: warning
trigger:
  - trigger: state
    entity_id: switch.kotel_rele_spinac
    to: "on"
    id: relay_on
  - trigger: state
    entity_id:
      - input_select.heating_flow_state_v4
      - input_boolean.heating_flow_relief_lockout
      - sensor.boiler_heatblock
    to: null
    id: safety_state_changed
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: event
    event_type: automation_reloaded
    id: reload
condition:
  - condition: state
    entity_id: switch.kotel_rele_spinac
    state: "on"
  # Native NOT/AND state conditions raise ConditionError for absent entities.
  # is_state/is_number handle absent/invalid inputs without that error, so OFF
  # remains fail-closed. is_number also rejects NaN/infinity; float has a default.
  - condition: template
    value_template: >-
      {% set block = states('sensor.boiler_heatblock') %}
      {{ not is_state('input_select.heating_flow_state_v4', 'NORMAL')
      or not is_state('input_boolean.heating_flow_relief_lockout', 'off')
      or not is_number(block) or block | float(72) >= 72 }}
action:
  - action: switch.turn_off
    target:
      entity_id: switch.kotel_rele_spinac

