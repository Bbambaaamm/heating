    \ endif %}\n{% endfor %}\n{% endif %}\n{% for c in expand('group.topne_zony') %}\n  {% set id = c.entity_id.split('.')[1] %}\n  {% set demand = states('sensor.zona_' ~ id ~ '_demand') %}\n  {% if c.entity_id in supported and c.state == 'heat'\n        and is_state('binary_sensor.zona_' ~ id ~ '_aktivni', 'on')\n        and is_state('binary_sensor.' ~ id ~ '_potrebne_teplo', 'on')\n        and is_number(demand) and 1 < demand | float(0) <= 100\n        and demand | float(0) >= min_d | float(101) %}\n    {% set ns.demands = ns.demands + [demand | float(0)] %}\n  {% endif %}\n{% endfor %}\n{{ not (ns.valid and ns.demands | count >= [min_z | int(99), 2] | max\n   and ns.demands | count > 0\n   and ns.demands | average(0) >= [min_a | float(999), 15] | max) }}"
  id: confirmed_policy_blocked
