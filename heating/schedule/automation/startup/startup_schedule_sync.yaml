# =====================================================================
# Soubor   : heating/schedule/automation/startup/startup_schedule_sync.yaml
# Modul    : Topení – synchronizace rozvrhů
# Účel     : Startovní a synchronizační automatizace plánování topení
# Autor    : Michal
# Poslední úprava : 2026-04-10
# Poznámka : YAML syntaxe podle HA 2024.10 (trigger / condition / action)
# =====================================================================

template:
  - sensor:
      - name: heating_schedule_windows
        unique_id: heating_schedule_windows
        state: "ready"
        attributes:
          # Scheduler computes weekdays, dates, midnight and DST. Its switch being
          # ON means enabled, NOT that a comfort interval is currently active.
          # Project schedules use one helper and one ON/OFF action per timeslot,
          # without additional conditions (Scheduler's attributes omit those).
          active_helpers: >-
            {% set ns = namespace(active=[]) %}
            {% for s in states.switch if s.state in ['on', 'triggered'] %}
              {% set targets = s.attributes.get('entities', []) %}
              {% set slot = s.attributes.get('current_slot') %}
              {% set actions = s.attributes.get('actions', []) %}
              {% if targets is sequence and targets is not string
                    and targets | count == 1
                    and targets[0] is string
                    and targets[0].startswith('input_boolean.')
                    and targets[0].endswith('_schedule_active')
                    and slot is integer and slot is not boolean
                    and actions is sequence and actions is not string
                    and 0 <= slot < actions | count
                    and actions[slot] is mapping
                    and actions[slot].get('service') == 'input_boolean.turn_on' %}
                {% set ns.active = ns.active + [targets[0]] %}
              {% endif %}
            {% endfor %}
            {{ ns.active | unique | sort | list }}

automation:
  - id: heating_sync_schedule_helpers
    alias: "Topení – příznaky podle skutečných oken Scheduleru"
    description: >-
      Opraví obnovené nebo osiřelé příznaky rozvrhu podle aktuálních
      časových úseků. Chybějící, vypnutý nebo nedostupný rozvrh není komfort.
      Během manuálního override pomocný příznak nemění, aby jeho oprava
      nebyla zaměněna za ukončující změnu rozvrhu.
    mode: restart
    initial_state: true
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id: sensor.heating_schedule_windows
      - trigger: time_pattern
        minutes: "/1"
    action:
      - condition: state
        entity_id: sensor.heating_schedule_windows
        state: "ready"
      - repeat:
          for_each:
            - sklep_michal
            - prizemi_michal
            - prizemi_chodba_zachod
            - 1p_jidelna
            - 1p_kuchyn
            - 1p_koupelna
            - 1p_chodba
            - 2p_mama
          sequence:
            - variables:
                helper: "{{ 'input_boolean.' ~ repeat.item ~ '_schedule_active' }}"
                manual: "{{ 'input_boolean.' ~ repeat.item ~ '_manual_override' }}"
                active: "{{ helper in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or []) }}"
            - if:
                - condition: template
                  value_template: "{{ is_state(manual, 'off') }}"
              then:
                - choose:
                    - conditions: "{{ active and is_state(helper, 'off') }}"
                      sequence:
                        - action: input_boolean.turn_on
                          target:
                            entity_id: "{{ helper }}"
                    - conditions: "{{ not active and is_state(helper, 'on') }}"
                      sequence:
                        - action: input_boolean.turn_off
                          target:
                            entity_id: "{{ helper }}"

  - id: heating_startup_schedule_sync
    alias: "Topení – synchronizace rozvrhů po startu HA"
    description: >
      Po startu Home Assistanta spustí chytré rozvrhy všech zón, aby
      se komfort/ECO teploty hlavic srovnaly s aktuálním režimem
      topení a nastaveným časovým oknem.
    mode: restart
    initial_state: true

    trigger:
      - trigger: homeassistant
        event: start

    condition: []

    action:
      # Malé zpoždění, aby se po startu načetly všechny helpery/automations
      - delay: "00:00:10"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heating_startup_reconcile_guard
      - delay: "00:00:15"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating_startup_reconcile_guard

      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.heating_central_dispatch_enable
                state: "on"
            sequence:
              - event: heating_reconcile_requested
                event_data:
                  source: heating_startup_schedule_sync
                  reason: startup
          - conditions:
              - condition: state
                entity_id: input_boolean.heating_central_dispatch_enable
                state: "off"
            sequence:
              # Spusť smart rozvrh pro všechny zóny (legacy fallback)
              - action: automation.trigger
                target:
                  entity_id: >-
                    {{ states.automation
                      | selectattr('entity_id', 'search', '_bp$')
                      | map(attribute='entity_id')
                      | list }}

      # Záznam do logbooku – pro přehled po restartu
      - action: logbook.log
        data:
          name: "Topení – rozvrhy"
          message: "Po startu HA spuštěna synchronizace rozvrhů (smart zóny)."
          entity_id: input_select.topny_rezim

  - id: heating_startup_reconcile_guard_watchdog
    alias: "Topení – startup reconcile guard watchdog"
    description: >
      Konzervativní ochrana proti zaseknutému startup guardu.
      Pokud guard zůstane zapnutý déle než 90 s, vynutí jeho vypnutí
      a zapíše varování.
    mode: single
    initial_state: true

    trigger:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: state
        entity_id: input_boolean.heating_startup_reconcile_guard
        to: "on"
        for: "00:01:30"

    condition:
      - condition: state
        entity_id: input_boolean.heating_startup_reconcile_guard
        state: "on"
      - condition: template
        value_template: >-
          {{ (now() - states.input_boolean.heating_startup_reconcile_guard.last_changed).total_seconds() >= 90 }}

    action:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heating_startup_reconcile_guard
      - event: heating_reconcile_requested
        event_data:
          source: heating_startup_reconcile_guard_watchdog
          reason: guard_released
      - action: logbook.log
        data:
          name: "Topení – startup guard watchdog"
          message: "Guard byl aktivní déle než 90 s, watchdog vynutil OFF."
          entity_id: input_boolean.heating_startup_reconcile_guard
      - action: persistent_notification.create
        data:
          notification_id: heating_startup_reconcile_guard_watchdog
          title: "Topení – watchdog startup guardu"
          message: >-
            ⚠️ Startup reconcile guard zůstal zapnutý déle než 90 s.
            Watchdog vynutil jeho vypnutí na OFF.
