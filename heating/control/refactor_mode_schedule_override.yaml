# =====================================================================
# Soubor   : heating/control/refactor_mode_schedule_override.yaml
# Modul    : Topení – řízení
# Účel     : Řídicí automatizace topného systému (režimy, watchdog, fail-safe, kotel)
# Autor    : Michal
# Poslední úprava : 2026-04-10
# Poznámka : YAML syntaxe podle HA 2024.10 (trigger / condition / action)
# =====================================================================

input_boolean:
  heating_central_dispatch_enable:
    name: "Heating – central dispatch enable"
    icon: mdi:source-branch-check
    # Obnovit poslední volbu centrálního / záložního řízení.
  heating_startup_reconcile_guard:
    name: "Heating – startup reconcile guard"
    icon: mdi:shield-sync
    initial: on

template:
  - sensor:
      - name: heating_global_intent
        unique_id: heating_global_intent
        state: >-
          {% set mode = states('input_select.topny_rezim') %}
          {% if mode == 'Off' %}off
          {% elif is_state('binary_sensor.kotel_boost_active', 'on') %}boost
          {% elif mode == 'Eco' %}eco
          {% else %}auto
          {% endif %}

  - binary_sensor:
      - name: heating_dispatch_inputs_available
        unique_id: heating_dispatch_inputs_available
        device_class: connectivity
        state: >-
          {% set required = [
            'input_select.topny_rezim',
            'input_boolean.topny_system_enable',
            'input_number.eco_temp_default',
            'input_number.boost_comfort_offset_c',
            'binary_sensor.kotel_boost_active'
          ] %}
          {{ required
             | map('states')
             | select('in', ['unknown', 'unavailable', ''])
             | list
             | count == 0 }}

script:
  heating_apply_zone_target:
    alias: "Heating – apply zone target (central)"
    mode: queued
    max: 2
    fields:
      climate_entity:
        name: Climate entity
        description: "Cílová climate entita pro nastavení teploty."
        required: true
        selector:
          entity:
            filter:
              domain: climate
      expected_inputs:
        name: Decision inputs at enqueue
        description: "Volitelný snímek vstupů pro odmítnutí zastaralého požadavku ve frontě."
      requested_temp:
        name: Requested temperature
        description: "Požadovaná teplota před clampem na min/max atribut entity."
        required: true
        selector:
          number:
            min: 5
            max: 30
            step: 0.1
            mode: box
      reason:
        name: Reason
        description: "Textový důvod pro zápis do logbooku."
        required: true
        selector:
          text:
    sequence:
      # Queued calls must still be permitted when they actually execute.
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_select.topny_rezim
        state: [Auto, Eco, Boost]
      - variables:
          decision_entities: >-
            {% set z = climate_entity.split('.')[1] %}
            {{ ['input_select.topny_rezim', 'binary_sensor.kotel_boost_active',
                'input_number.eco_temp_default', 'input_number.boost_comfort_offset_c',
                'input_number.' ~ z ~ '_last_comfort',
                'input_boolean.' ~ z ~ '_schedule_active',
                'input_boolean.' ~ z ~ '_manual_override',
                'input_select.' ~ z ~ '_manual_override_type',
                'timer.' ~ z ~ '_manual_override',
                'input_boolean.schedule_enable_' ~ z] }}
          schedule_helper: "{{ 'input_boolean.' ~ climate_entity.split('.')[1] ~ '_schedule_active' }}"
          decision_inputs: "{{ (decision_entities | map('states') | list) + [schedule_helper in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] }}"
          climate_state: "{{ states(climate_entity) }}"
          climate_obj: "{{ states[climate_entity] }}"
          climate_exists: "{{ climate_obj is not none }}"
          climate_ready: >-
            {{ climate_exists
               and climate_state not in ['unknown', 'unavailable', ''] }}
          # A disabled zone stays at ECO even for direct/queued script callers.
          target_raw: >-
            {{ requested_temp if is_state('input_boolean.schedule_enable_' ~ climate_entity.split('.')[1], 'on')
               else states('input_number.eco_temp_default') }}
          target_valid: >-
            {% set raw = target_raw %}
            {% if raw is none %}
              false
            {% else %}
              {% set s = (raw | string | trim | lower) %}
              {% if s in ['', 'none', 'unknown', 'unavailable'] %}
                false
              {% else %}
                {{ s | regex_match('^-?\\d+(\\.\\d+)?$') }}
              {% endif %}
            {% endif %}
          tmin: "{{ state_attr(climate_entity, 'min_temp') | float(5) }}"
          tmax: "{{ state_attr(climate_entity, 'max_temp') | float(30) }}"
          target: >-
            {% set x = target_raw | float(tmin) %}
            {% if x < tmin %}{{ tmin }}
            {% elif x > tmax %}{{ tmax }}
            {% else %}{{ x }}{% endif %}
      - condition: template
        value_template: "{{ expected_inputs is not defined or expected_inputs == decision_inputs }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ climate_ready and target_valid }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ climate_state != 'heat' }}"
                    sequence:
                      - action: climate.set_hvac_mode
                        target:
                          entity_id: "{{ climate_entity }}"
                        data:
                          hvac_mode: heat
              # A device action can await I/O. Do not send its old setpoint
              # if policy or this zone's inputs changed during that await.
              - condition: template
                value_template: >-
                  {{ is_state('input_boolean.topny_system_enable', 'on')
                     and (decision_entities | map('states') | list) + [schedule_helper in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] == decision_inputs }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ not is_number(state_attr(climate_entity, 'temperature'))
                         or ((state_attr(climate_entity, 'temperature') | float(target))
                          - (target | float(0))) | abs > 0.1 }}
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ climate_entity }}"
                    data:
                      temperature: "{{ target | round(1) }}"
              # Check current state too: a report can arrive before the wait starts.
              # One bounded wait, no blind retries. A newer intent cancels verification.
              - wait_template: >-
                  {{ not is_state('input_boolean.topny_system_enable', 'on')
                     or (decision_entities | map('states') | list) + [schedule_helper in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] != decision_inputs
                     or not has_value(climate_entity)
                     or (is_state(climate_entity, 'heat')
                         and is_number(state_attr(climate_entity, 'temperature'))
                         and ((state_attr(climate_entity, 'temperature') | float(0))
                              - (target | round(1))) | abs <= 0.1) }}
                timeout: "00:00:30"
                continue_on_timeout: true
              - condition: state
                entity_id: input_boolean.topny_system_enable
                state: "on"
              - condition: template
                value_template: "{{ (decision_entities | map('states') | list) + [schedule_helper in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] == decision_inputs }}"
              - if:
                  - condition: template
                    value_template: >-
                      {{ not (is_state(climate_entity, 'heat')
                              and is_number(state_attr(climate_entity, 'temperature'))
                              and ((state_attr(climate_entity, 'temperature') | float(0))
                                   - (target | round(1))) | abs <= 0.1) }}
                then:
                  - action: persistent_notification.create
                    continue_on_error: true
                    data:
                      notification_id: "{{ 'heating_target_' ~ climate_entity.split('.')[1] }}"
                      title: "Topení – chybí potvrzení cíle"
                      message: >-
                        {{ climate_entity }} nehlásí požadovaný režim heat a cíl
                        {{ target | round(1) }} °C ({{ reason }}).
                        Stav: {{ states(climate_entity) }},
                        hlášený cíl: {{ state_attr(climate_entity, 'temperature') }} °C.
                        Automatické opakování nebylo provedeno. Zkontrolujte hlavici a spojení.
                  - stop: "Hlavice nehlásí požadovaný režim nebo cílovou teplotu."
                    error: true
              - action: persistent_notification.dismiss
                continue_on_error: true
                data:
                  notification_id: "{{ 'heating_target_' ~ climate_entity.split('.')[1] }}"
              - action: logbook.log
                data:
                  name: "Heating dispatch"
                  message: "Potvrzen hlášený cíl: {{ climate_entity }} -> {{ target | round(1) }} °C ({{ reason }})"
                  entity_id: "{{ climate_entity }}"
        default:
          - action: logbook.log
            continue_on_error: true
            data:
              name: "Heating dispatch"
              message: >-
                WARNING: Přeskočeno nastavení teploty pro {{ climate_entity }}.
                climate_exists={{ climate_exists }}, climate_state={{ climate_state }},
                climate_ready={{ climate_ready }}, target_valid={{ target_valid }},
                requested_temp={{ target_raw }} ({{ reason }}).
              entity_id: "{{ climate_entity }}"
          - stop: "Nedostupná hlavice nebo neplatná cílová teplota."
            error: true

automation:
  - id: heating_failsafe_dispatch_inputs_unavailable
    alias: "Heating – fail-safe při výpadku dispatch vstupů"
    mode: single
    trigger:
      - trigger: state
        entity_id: binary_sensor.heating_dispatch_inputs_available
        to: "off"
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_boolean.heating_central_dispatch_enable
        state: "on"
    action:
      - variables:
          required_entities:
            - input_select.topny_rezim
            - input_boolean.topny_system_enable
            - input_number.eco_temp_default
            - input_number.boost_comfort_offset_c
            - binary_sensor.kotel_boost_active
          unavailable_entities: >-
            {% set ns = namespace(items=[]) %}
            {% for e in required_entities %}
              {% if states(e) in ['unknown', 'unavailable', ''] %}
                {% set ns.items = ns.items + [e ~ '=' ~ states(e)] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}
          current_mode: "{{ states('input_select.topny_rezim') }}"
      - action: persistent_notification.create
        data:
          notification_id: heating_dispatch_inputs_unavailable
          title: "Heating fail-safe"
          message: >-
            ⚠️ Dispatch vstupy nedostupné > 2 min.
            Žádný zásah do režimu (pouze upozornění + diagnostika).
            Aktuální režim: {{ current_mode }}.
            Nedostupné vstupy: {{ unavailable_entities }}.
      - action: logbook.log
        data:
          name: "Heating fail-safe"
          message: >-
            Dispatch vstupy nedostupné > 2 min. Bez přepnutí režimu (pouze diagnostika).
            mode={{ current_mode }}, unavailable={{ unavailable_entities }}
          entity_id: binary_sensor.heating_dispatch_inputs_available

  - id: heating_dispatch_inputs_recovered
    alias: "Heating – dispatch vstupy obnoveny"
    mode: single
    trigger:
      - trigger: state
        entity_id: binary_sensor.heating_dispatch_inputs_available
        to: "on"
        for: "00:02:00"
    condition:
      - condition: state
        entity_id: input_boolean.heating_central_dispatch_enable
        state: "on"
    action:
      - event: heating_reconcile_requested
        event_data:
          source: heating_dispatch_inputs_recovered
          reason: inputs_recovered
      - action: persistent_notification.dismiss
        data:
          notification_id: heating_dispatch_inputs_unavailable
      - action: logbook.log
        data:
          name: "Heating fail-safe"
          message: "Dispatch vstupy jsou opět dostupné (stabilní 2 min)."
          entity_id: binary_sensor.heating_dispatch_inputs_available

  - id: heating_dispatch_mode_schedule_override
    alias: "Heating – central dispatch (mode/schedule/override)"
    mode: restart
    trigger:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: heating_reconcile_requested
      - trigger: event
        event_type: automation_reloaded
      - trigger: state
        entity_id: sensor.heating_schedule_windows
      - trigger: state
        entity_id:
          - input_boolean.schedule_enable_sklep_michal
          - input_boolean.schedule_enable_prizemi_michal
          - input_boolean.schedule_enable_prizemi_chodba_zachod
          - input_boolean.schedule_enable_1p_jidelna
          - input_boolean.schedule_enable_1p_kuchyn
          - input_boolean.schedule_enable_1p_koupelna
          - input_boolean.schedule_enable_1p_chodba
          - input_boolean.schedule_enable_2p_mama
      - trigger: state
        entity_id:
          - climate.sklep_michal
          - climate.prizemi_michal
          - climate.prizemi_chodba_zachod
          - climate.1p_jidelna
          - climate.1p_kuchyn
          - climate.1p_koupelna
          - climate.1p_chodba
          - climate.2p_mama
        from:
          - unavailable
          - unknown
      - trigger: state
        entity_id: input_boolean.heating_central_dispatch_enable
        to: "on"
      - trigger: state
        entity_id:
          - input_select.topny_rezim
          - input_boolean.topny_system_enable
          - input_number.eco_temp_default
          - input_number.boost_comfort_offset_c
          - binary_sensor.kotel_boost_active
          - input_number.sklep_michal_last_comfort
          - input_number.prizemi_michal_last_comfort
          - input_number.prizemi_chodba_zachod_last_comfort
          - input_number.1p_jidelna_last_comfort
          - input_number.1p_kuchyn_last_comfort
          - input_number.1p_koupelna_last_comfort
          - input_number.1p_chodba_last_comfort
          - input_number.2p_mama_last_comfort
          - input_boolean.sklep_michal_schedule_active
          - input_boolean.prizemi_michal_schedule_active
          - input_boolean.prizemi_chodba_zachod_schedule_active
          - input_boolean.1p_jidelna_schedule_active
          - input_boolean.1p_kuchyn_schedule_active
          - input_boolean.1p_koupelna_schedule_active
          - input_boolean.1p_chodba_schedule_active
          - input_boolean.2p_mama_schedule_active
          - input_boolean.sklep_michal_manual_override
          - input_boolean.prizemi_michal_manual_override
          - input_boolean.prizemi_chodba_zachod_manual_override
          - input_boolean.1p_jidelna_manual_override
          - input_boolean.1p_kuchyn_manual_override
          - input_boolean.1p_koupelna_manual_override
          - input_boolean.1p_chodba_manual_override
          - input_boolean.2p_mama_manual_override
          - input_select.sklep_michal_manual_override_type
          - input_select.prizemi_michal_manual_override_type
          - input_select.prizemi_chodba_zachod_manual_override_type
          - input_select.1p_jidelna_manual_override_type
          - input_select.1p_kuchyn_manual_override_type
          - input_select.1p_koupelna_manual_override_type
          - input_select.1p_chodba_manual_override_type
          - input_select.2p_mama_manual_override_type
          - timer.sklep_michal_manual_override
          - timer.prizemi_michal_manual_override
          - timer.prizemi_chodba_zachod_manual_override
          - timer.1p_jidelna_manual_override
          - timer.1p_kuchyn_manual_override
          - timer.1p_koupelna_manual_override
          - timer.1p_chodba_manual_override
          - timer.2p_mama_manual_override
        for: "00:00:08"

    condition:
      - condition: state
        entity_id: input_boolean.heating_central_dispatch_enable
        state: "on"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: binary_sensor.heating_dispatch_inputs_available
        state: "on"
      - condition: state
        entity_id: input_boolean.heating_startup_reconcile_guard
        state: "off"

    variables:
      eco: "{{ states('input_number.eco_temp_default') | float(15) }}"
      boost_offset: "{{ states('input_number.boost_comfort_offset_c') | float(0) }}"
      intent: "{{ states('sensor.heating_global_intent') }}"
      zones: >-
        {{ [
          dict(climate='climate.sklep_michal', schedule='input_boolean.sklep_michal_schedule_active', last='input_number.sklep_michal_last_comfort', manual='input_boolean.sklep_michal_manual_override', manual_type='input_select.sklep_michal_manual_override_type', timer='timer.sklep_michal_manual_override'),
          dict(climate='climate.prizemi_michal', schedule='input_boolean.prizemi_michal_schedule_active', last='input_number.prizemi_michal_last_comfort', manual='input_boolean.prizemi_michal_manual_override', manual_type='input_select.prizemi_michal_manual_override_type', timer='timer.prizemi_michal_manual_override'),
          dict(climate='climate.prizemi_chodba_zachod', schedule='input_boolean.prizemi_chodba_zachod_schedule_active', last='input_number.prizemi_chodba_zachod_last_comfort', manual='input_boolean.prizemi_chodba_zachod_manual_override', manual_type='input_select.prizemi_chodba_zachod_manual_override_type', timer='timer.prizemi_chodba_zachod_manual_override'),
          dict(climate='climate.1p_jidelna', schedule='input_boolean.1p_jidelna_schedule_active', last='input_number.1p_jidelna_last_comfort', manual='input_boolean.1p_jidelna_manual_override', manual_type='input_select.1p_jidelna_manual_override_type', timer='timer.1p_jidelna_manual_override'),
          dict(climate='climate.1p_kuchyn', schedule='input_boolean.1p_kuchyn_schedule_active', last='input_number.1p_kuchyn_last_comfort', manual='input_boolean.1p_kuchyn_manual_override', manual_type='input_select.1p_kuchyn_manual_override_type', timer='timer.1p_kuchyn_manual_override'),
          dict(climate='climate.1p_koupelna', schedule='input_boolean.1p_koupelna_schedule_active', last='input_number.1p_koupelna_last_comfort', manual='input_boolean.1p_koupelna_manual_override', manual_type='input_select.1p_koupelna_manual_override_type', timer='timer.1p_koupelna_manual_override'),
          dict(climate='climate.1p_chodba', schedule='input_boolean.1p_chodba_schedule_active', last='input_number.1p_chodba_last_comfort', manual='input_boolean.1p_chodba_manual_override', manual_type='input_select.1p_chodba_manual_override_type', timer='timer.1p_chodba_manual_override'),
          dict(climate='climate.2p_mama', schedule='input_boolean.2p_mama_schedule_active', last='input_number.2p_mama_last_comfort', manual='input_boolean.2p_mama_manual_override', manual_type='input_select.2p_mama_manual_override_type', timer='timer.2p_mama_manual_override')
        ] }}

    action:
      - delay: "00:00:02"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_boolean.heating_central_dispatch_enable
        state: "on"
      - condition: state
        entity_id: binary_sensor.heating_dispatch_inputs_available
        state: "on"
      - condition: state
        entity_id: input_boolean.heating_startup_reconcile_guard
        state: "off"
      # Read intent after the debounce, not before it.
      - variables:
          eco: "{{ states('input_number.eco_temp_default') | float(15) }}"
          boost_offset: "{{ states('input_number.boost_comfort_offset_c') | float(0) }}"
          intent: >-
            {% set mode = states('input_select.topny_rezim') %}
            {% if mode == 'Off' %}off
            {% elif is_state('binary_sensor.kotel_boost_active', 'on') %}boost
            {% elif mode == 'Eco' %}eco
            {% else %}auto{% endif %}
          trigger_entity: "{{ trigger.entity_id if trigger is defined and trigger.entity_id is defined else 'n/a' }}"
          trigger_id: "{{ trigger.id if trigger is defined and trigger.id is defined else 'n/a' }}"
          debug_guard: "{{ is_state('input_boolean.heating_debug_guard', 'on') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ debug_guard }}"
            sequence:
              - action: logbook.log
                data:
                  name: "Heating dispatch"
                  message: >-
                    Triggered (id={{ trigger_id }}, entity={{ trigger_entity }}),
                    intent={{ intent }}, dispatch={{ states('input_boolean.heating_central_dispatch_enable') }}.
                  entity_id: input_select.topny_rezim
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ intent == 'off' }}"
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ debug_guard
                             or trigger_entity in ['input_select.topny_rezim', 'binary_sensor.kotel_boost_active'] }}
                    sequence:
                      - action: logbook.log
                        data:
                          name: "Heating dispatch"
                          message: "Intent OFF: dispatch neaplikuje setpointy."
                          entity_id: input_select.topny_rezim
              - stop: "Režim Off"

      - repeat:
          for_each: "{{ zones }}"
          sequence:
            - condition: template
              value_template: >-
                {% set mode = states('input_select.topny_rezim') %}
                {% set current_intent = 'off' if mode == 'Off' else
                   'boost' if is_state('binary_sensor.kotel_boost_active', 'on') else
                   'eco' if mode == 'Eco' else 'auto' %}
                {{ is_state('input_boolean.topny_system_enable', 'on')
                   and is_state('input_boolean.heating_central_dispatch_enable', 'on')
                   and current_intent == intent and intent != 'off' }}
            - variables:
                expected_inputs: >-
                  {{ [states('input_select.topny_rezim'), states('binary_sensor.kotel_boost_active'),
                      states('input_number.eco_temp_default'), states('input_number.boost_comfort_offset_c'),
                      states(repeat.item.last), states(repeat.item.schedule), states(repeat.item.manual),
                      states(repeat.item.manual_type), states(repeat.item.timer),
                      states('input_boolean.schedule_enable_' ~ repeat.item.climate.split('.')[1]),
                      repeat.item.schedule in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or [])] }}
                in_window: "{{ repeat.item.schedule in (state_attr('sensor.heating_schedule_windows', 'active_helpers') or []) }}"
                raw_last: "{{ states(repeat.item.last) }}"
                last_comfort: >-
                  {% set parsed_last = raw_last | float(default=none) %}
                  {% if parsed_last is not none %}
                    {{ parsed_last }}
                  {% else %}
                    {{ eco }}
                  {% endif %}
                override_effective: >-
                  {{ is_state(repeat.item.manual, 'on')
                     and (
                       states(repeat.item.manual_type) == 'Do další změny rozvrhu'
                       or (states(repeat.item.manual_type) == 'Časovač'
                           and is_state(repeat.item.timer, 'active'))
                     ) }}
                target: >-
                  {% if not is_state('input_boolean.schedule_enable_' ~ repeat.item.climate.split('.')[1], 'on') %}
                    {{ eco }}
                  {% elif override_effective %}
                    {{ last_comfort }}
                  {% elif intent == 'boost' %}
                    {{ last_comfort + boost_offset }}
                  {% elif intent == 'eco' %}
                    {{ eco }}
                  {% elif in_window %}
                    {{ last_comfort }}
                  {% else %}
                    {{ eco }}
                  {% endif %}
                reason: >-
                  {% if not is_state('input_boolean.schedule_enable_' ~ repeat.item.climate.split('.')[1], 'on') %}schedule_disabled_eco
                  {% elif override_effective %}override
                  {% elif intent == 'boost' %}boost
                  {% elif intent == 'eco' %}eco
                  {% elif in_window %}schedule_comfort
                  {% else %}schedule_eco
                  {% endif %}

            - action: script.heating_apply_zone_target
              continue_on_error: true
              data:
                climate_entity: "{{ repeat.item.climate }}"
                requested_temp: "{{ target }}"
                expected_inputs: "{{ expected_inputs }}"
                reason: "{{ reason }}"
