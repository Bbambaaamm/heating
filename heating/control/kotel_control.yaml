# Řízení relé: časování se váže na změnu rozhodnutí, nikoli na každý PI report.
# Jde o debounce požadavku; nejde o výrobcem stanovené minimum chodu/odstávky.
automation:
  - alias: "Kotel: zapnout při splnění politiky"
    id: kotel_turn_on_by_policy
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "on"
      - trigger: state
        entity_id: sensor.kotel_effective_on_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: "off"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
    action:
      - delay:
          seconds: "{{ states('sensor.kotel_effective_on_delay_sec') | int(120) }}"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
      - action: switch.turn_on
        target:
          entity_id: switch.kotel_rele_spinac

  - alias: "Kotel: vypnout při nesplnění politiky / blokaci"
    id: kotel_turn_off_by_policy
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "off"
      - trigger: state
        entity_id: sensor.kotel_effective_off_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
    action:
      - delay:
          seconds: "{{ states('sensor.kotel_effective_off_delay_sec') | int(300) }}"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - action: switch.turn_off
        target:
          entity_id: switch.kotel_rele_spinac
