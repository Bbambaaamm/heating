# Single active TUV relay owner: automations.yaml id 1791310763182
# (Topení – TUV interlock relé LIVE). Do not add a second package automation.
# Keep the current Flow V4 safety state-machine and hardware fault interlocks.
# Řízení relé: časování se váže na změnu rozhodnutí, nikoli na každý PI report.
# Jde o debounce požadavku; nejde o výrobcem stanovené minimum chodu/odstávky.
# Podmínky jsou uvnitř action: opačný stav musí zrušit rozběhnutý odpočet
# i tehdy, kdy by podmínky nového běhu neprošly. PI reporty odpočet nerestartují.
automation:
  # Historical fallback controller retained for audit/rollback only.
  # Flow V4 owns the active start, and deactivates any re-enabled legacy branch.
  - alias: "Kotel: zapnout při splnění politiky"
    id: kotel_turn_on_by_policy
    initial_state: false
    mode: restart
    trigger:
      - trigger: state
        entity_id:
          - input_boolean.topny_system_enable
          - input_select.topny_rezim
          - binary_sensor.kotel_mode_off_block
          - binary_sensor.boiler_ww3wayvalve
          - binary_sensor.boiler_wwcharging
          - binary_sensor.boiler_tapwateractive
        to: null
      # Attributes of the aggregate may change while state remains ON:
      # listen only for actual demand transitions to avoid resetting the 120s timer.
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "on"
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "off"
      # Drop pending start immediately if a demand sensor becomes unavailable.
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "unavailable"
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "unknown"
      - trigger: state
        entity_id: sensor.kotel_effective_on_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: null
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition: []
    action:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_select.topny_rezim
        state: ["Auto", "Eco", "Boost"]
      - condition: state
        entity_id: binary_sensor.kotel_mode_off_block
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_ww3wayvalve
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwcharging
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_tapwateractive
        state: "off"
      - delay:
          # Druhá nezávislá pojistka: ani vadný efektivní senzor nesmí
          # spustit kotel dříve, než se termostatické ventily otevřou.
          seconds: "{{ [states('sensor.kotel_effective_on_delay_sec') | int(120), 120] | max }}"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_select.topny_rezim
        state: ["Auto", "Eco", "Boost"]
      - condition: state
        entity_id: binary_sensor.kotel_mode_off_block
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_ww3wayvalve
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwcharging
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_tapwateractive
        state: "off"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
      - action: switch.turn_on
        target:
          entity_id: switch.kotel_rele_spinac

  - alias: "Kotel: vypnout při nesplnění politiky / blokaci"
    id: kotel_turn_off_by_policy
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "off"
      # An ON transition still cancels pending OFF action in restart mode.
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "on"
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "unavailable"
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: "unknown"
      - trigger: state
        entity_id: sensor.kotel_effective_off_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: null
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition: []
    action:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - delay:
          # Po zániku požadavku nenechávej hořák běžet proti zavírajícím TRV.
          seconds: "{{ [[states('sensor.kotel_effective_off_delay_sec') | int(10), 0] | max, 30] | min }}"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - action: switch.turn_off
        target:
          entity_id: switch.kotel_rele_spinac
