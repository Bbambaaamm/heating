# Řízení relé: časování se váže na změnu rozhodnutí, nikoli na každý PI report.
# Jde o debounce požadavku; nejde o výrobcem stanovené minimum chodu/odstávky.
# Podmínky jsou uvnitř action: opačný stav musí zrušit rozběhnutý odpočet
# i tehdy, kdy by podmínky nového běhu neprošly. PI reporty odpočet nerestartují.
automation:
  - alias: "Kotel: zapnout při splnění politiky"
    id: kotel_turn_on_by_policy
    mode: restart
    trigger:
      - trigger: state
        entity_id:
          - binary_sensor.kotel_should_be_on
          - input_boolean.topny_system_enable
          - input_select.topny_rezim
          - binary_sensor.kotel_mode_off_block
          - binary_sensor.boiler_ww3wayvalve
          - binary_sensor.boiler_wwcharging
          - binary_sensor.boiler_tapwateractive
          - binary_sensor.boiler_wwrecharging
        to: null
      - trigger: state
        entity_id: sensor.kotel_effective_on_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: null
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition: []
    action:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_select.topny_rezim
        state: ["Auto", "Eco", "Boost"]
      - condition: state
        entity_id: binary_sensor.kotel_mode_off_block
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_ww3wayvalve
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwcharging
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_tapwateractive
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwrecharging
        state: "off"
      - delay:
          # Druhá nezávislá pojistka: ani vadný efektivní senzor nesmí
          # spustit kotel dříve, než se termostatické ventily otevřou.
          seconds: "{{ [states('sensor.kotel_effective_on_delay_sec') | int(120), 120] | max }}"
      - condition: state
        entity_id: input_boolean.topny_system_enable
        state: "on"
      - condition: state
        entity_id: input_select.topny_rezim
        state: ["Auto", "Eco", "Boost"]
      - condition: state
        entity_id: binary_sensor.kotel_mode_off_block
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_ww3wayvalve
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwcharging
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_tapwateractive
        state: "off"
      - condition: state
        entity_id: binary_sensor.boiler_wwrecharging
        state: "off"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "on"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "off"
      - action: switch.turn_on
        target:
          entity_id: switch.kotel_rele_spinac

  - alias: "Kotel: vypnout při nesplnění politiky / blokaci"
    id: kotel_turn_off_by_policy
    mode: restart
    trigger:
      - trigger: state
        entity_id: binary_sensor.kotel_should_be_on
        to: null
      - trigger: state
        entity_id: sensor.kotel_effective_off_delay_sec
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: null
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition: []
    action:
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - delay:
          # Po zániku požadavku nenechávej hořák běžet proti zavírajícím TRV.
          seconds: "{{ [[states('sensor.kotel_effective_off_delay_sec') | int(10), 0] | max, 30] | min }}"
      - condition: state
        entity_id: binary_sensor.kotel_should_be_on
        state: "off"
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - action: switch.turn_off
        target:
          entity_id: switch.kotel_rele_spinac


  - alias: "Kotel: TUV interlock relé"
    id: kotel_tuv_relay_interlock
    description: >-
      Fail-closed TUV hydraulický interlock. Topné relé smí zůstat sepnuté
      pouze pokud jsou všechny čtyři TUV signály explicitně off. Unknown,
      unavailable, restart/reload nebo aktivní TUV cesta vyvolají okamžité
      vypnutí relé. Výsledek se ověřuje a při nepotvrzení proběhne jeden
      omezený retry; neúspěch uzamkne další topný start.
    mode: restart
    trigger:
      - trigger: state
        entity_id:
          - binary_sensor.boiler_ww3wayvalve
          - binary_sensor.boiler_wwcharging
          - binary_sensor.boiler_tapwateractive
          - binary_sensor.boiler_wwrecharging
        to: null
      - trigger: state
        entity_id: switch.kotel_rele_spinac
        to: "on"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    condition:
      - condition: state
        entity_id: switch.kotel_rele_spinac
        state: "on"
      - condition: not
        conditions:
          - condition: and
            conditions:
              - condition: state
                entity_id: binary_sensor.boiler_ww3wayvalve
                state: "off"
              - condition: state
                entity_id: binary_sensor.boiler_wwcharging
                state: "off"
              - condition: state
                entity_id: binary_sensor.boiler_tapwateractive
                state: "off"
              - condition: state
                entity_id: binary_sensor.boiler_wwrecharging
                state: "off"
    action:
      - action: switch.turn_off
        continue_on_error: true
        target:
          entity_id: switch.kotel_rele_spinac
      - wait_template: "{{ is_state('switch.kotel_rele_spinac', 'off') }}"
        timeout: "00:00:02"
        continue_on_timeout: true
      - if:
          - condition: state
            entity_id: switch.kotel_rele_spinac
            state: "on"
        then:
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: switch.kotel_rele_spinac
          - wait_template: "{{ is_state('switch.kotel_rele_spinac', 'off') }}"
            timeout: "00:00:03"
            continue_on_timeout: true
      - if:
          - condition: state
            entity_id: switch.kotel_rele_spinac
            state: "on"
        then:
          - action: input_boolean.turn_off
            continue_on_error: true
            target:
              entity_id: input_boolean.topny_system_enable
          - action: input_boolean.turn_on
            continue_on_error: true
            target:
              entity_id: input_boolean.heating_flow_relief_lockout
          - action: persistent_notification.create
            data:
              notification_id: heating_tuv_interlock_relay_off_failed
              title: "Topení – TUV interlock: relé nepotvrdilo OFF"
              message: >-
                Topné relé zůstalo ON i po dvou pokusech o vypnutí během
                aktivní/neznámé TUV cesty. Hlavní topení bylo vypnuto a další
                start je uzamčen. Zkontrolujte Zigbee relé a TUV telemetrii.
          - action: logbook.log
            data:
              name: "Topení – TUV interlock"
              entity_id: switch.kotel_rele_spinac
              message: "CRITICAL: relé nepotvrdilo OFF po bounded retry; master OFF + lockout."
          - stop: "TUV interlock nepotvrdil vypnutí relé."
            error: true
        else:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: heating_tuv_interlock_relay_off_failed
          - action: logbook.log
            data:
              name: "Topení – TUV interlock"
              entity_id: switch.kotel_rele_spinac
              message: >-
                Topné relé je potvrzeně OFF, protože TUV cesta není explicitně
                bezpečná pro vytápění. Nový start dostane po stabilizaci TUV
                znovu plnou 120s prodlevu.

