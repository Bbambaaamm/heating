# =====================================================================
# Soubor   : heating/policy/policy_config.yaml
# Modul    : Topení – politika
# Účel     : Konfigurace a výpočet efektivní topné politiky
# Autor    : Michal
# Poslední úprava : 2026-04-10
# Poznámka : YAML syntaxe podle HA 2024.10 (trigger / condition / action)
# =====================================================================

# Bez initial: při restartu obnovit poslední skutečné nastavení obsluhy.
# Nová instalace bez historie obnovy vyžaduje nastavení politiky před zapnutím
# hlavního systému. Referenční hodnoty: 15 %, 5 %, 2 zóny, 120 s / 10 s.
input_number:

  # -------------------------------------------------------------------
  # HELPER: Minimální průměrná poptávka (%) napříč aktivními zónami
  # Logika:
  # - pokud průměrná poptávka aktivních zón překročí tuto hodnotu,
  #   může být kotel zapnut (pokud splní i ostatní podmínky)
  # -------------------------------------------------------------------
  kotel_min_avg_demand_pct:
    name: "Kotel – min. průměrná poptávka (%)"
    unit_of_measurement: "%"
    icon: mdi:percent
    min: 0
    max: 100
    step: 1

  # -------------------------------------------------------------------
  # HELPER: Minimální demand zóny pro započítání do rozhodování kotle (%)
  # Logika:
  # - zóna se započítá do průměru / počtu pouze pokud:
  #   - je aktivní
  #   - a její demand >= této hodnoty
  # - slouží k odfiltrování malých PI impulzů (např. koupelna, chodba)
  # -------------------------------------------------------------------
  kotel_min_zone_demand_pct:
    name: "Kotel – min. demand zóny (%)"
    unit_of_measurement: "%"
    icon: mdi:percent
    min: 0
    max: 100
    step: 1

  # -------------------------------------------------------------------
  # HELPER: Minimální počet aktivních zón
  # Logika:
  # - určuje, kolik zón musí být „aktivních“, aby se kotel mohl zapnout
  # - jedna zóna je hydraulicky zakázaná: při provozním testu vyvolala 2964
  # - hodnota 2 je bezpečnostní minimum, ne potvrzené hydraulické optimum
  # -------------------------------------------------------------------
  kotel_min_active_zones:
    name: "Kotel – min. počet aktivních zón"
    icon: mdi:numeric
    min: 0
    max: 10
    step: 1

  # -------------------------------------------------------------------
  # HELPER: Zpoždění zapnutí kotle (sekundy)
  # Logika:
  # - anti-cycling parametr
  # - kotel se zapne až po X sekundách od vzniku požadavku, pokud trvá
  # -------------------------------------------------------------------
  kotel_on_delay_sec:
    name: "Kotel – zpoždění zapnutí (s)"
    unit_of_measurement: "s"
    icon: mdi:timer-play
    min: 0
    max: 900
    step: 10

  # -------------------------------------------------------------------
  # HELPER: Zpoždění vypnutí kotle (sekundy)
  # Logika:
  # - po zániku požadavků vypne relé téměř okamžitě, dříve než se TRV zavřou
  # - pokud během čekání přijde nový požadavek, odpočet se zruší
  # -------------------------------------------------------------------
  kotel_off_delay_sec:
    name: "Kotel – zpoždění vypnutí (s)"
    unit_of_measurement: "s"
    icon: mdi:timer-stop
    min: 0
    max: 1800
    step: 10
