name: Heating audit and validation

on:
  pull_request:
    paths:
      - 'heating/**'
      - 'automations.yaml'
      - 'configuration.yaml'
      - 'scripts/**'
      - '.github/workflows/heating-audit-validation.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'heating/**'
      - 'automations.yaml'
      - 'configuration.yaml'
      - 'scripts/**'
      - '.github/workflows/heating-audit-validation.yml'

jobs:
  protective-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimum dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run automatic protective checks
        run: python3 scripts/run_protective_checks.py
