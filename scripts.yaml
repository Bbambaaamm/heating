    -
      condition: "state"
      entity_id: "input_boolean.heating_service_mode"
      state: "off"
    -
      action: "input_boolean.turn_off"
      target:
        entity_id: "input_boolean.topny_system_enable"
      continue_on_error: true
    -
      action: "switch.turn_off"
      target:
        entity_id: "switch.kotel_rele_spinac"
      continue_on_error: true
    -
      if:
        -
          condition: "template"
          value_template: |-
            {% set ns=namespace(ok=true) %}
            {% for z in ['sklep_michal','prizemi_michal','prizemi_chodba_zachod','1p_jidelna','1p_kuchyn','1p_koupelna','1p_chodba','2p_mama'] %}
              {% set target = targets[z] %}
              {% set actual = state_attr('climate.' ~ z, 'temperature') %}
              {% if target is not number or actual is not number or ((actual|float)-(target|float))|abs >= 0.1 %}
                {% set ns.ok=false %}
              {% endif %}
            {% endfor %}
            {{ ns.ok }}
      then:
        -
          action: "input_boolean.turn_on"
          target:
            entity_id: "input_boolean.heating_restore_verified"
        -
          action: "logbook.log"
          data:
            name: "Topení – obnova rozvrhů"
            entity_id: "input_boolean.heating_restore_verified"
            message: "Všech 8 hlavic potvrdilo očekávané cíle; obnova je ověřená."
      else:
        -
          action: "input_boolean.turn_off"
          target:
            entity_id: "input_boolean.heating_restore_verified"
        -
          action: "persistent_notification.create"
          data:
            notification_id: "heating_restore_verification_failed"
            title: "Topení – obnova rozvrhů není ověřena"
            message: "Po obnově nepotvrdilo všech 8 hlavic očekávané cíle. Hlavní řízení zůstává blokované, dokud recovery logika nepotvrdí bezpečný stav."
    -
      action: "persistent_notification.dismiss"
      data:
        notification_id: "heating_service_mode"
